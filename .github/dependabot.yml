version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  # The repo has no Dockerfile; the only image lives in docker-compose.yml.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # A new Postgres major cannot open the existing postgres-data volume without pg_upgrade.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # init and analyze must stay on the same CodeQL version.
      codeql-action:
        patterns:
          - "github/codeql-action*"
