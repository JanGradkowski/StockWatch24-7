name: Security and tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily, so the vulnerability database cached on main is never more than a day behind the NVD.
    - cron: "19 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, scan, and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read

    services:
      postgres:
        image: postgres:16.14@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c
        env:
          POSTGRES_USER: uptodate
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: uptodate_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uptodate -d uptodate_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/uptodate_db
      DB_USERNAME: uptodate
      DB_PASSWORD: ci-only-password
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: java-kotlin

      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      # Browser-side modules (charts, watchlists, i18n guards) have their own jsdom tests. The runner's
      # preinstalled Node runs them; the Playwright browsers are only needed for the manual UI checks.
      - name: Run frontend tests
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci --no-audit --no-fund
          npm test

      # The audit (OWASP dependency-check) works from a local copy of the NVD. That copy used to live in
      # ~/.m2 and ride along in setup-java's Maven cache, which is saved only when pom.xml changes, so
      # every run had to fetch all NVD changes since one old snapshot. Once that backlog reached ~28k
      # records, the NVD API's slow change queries kept the audit running into the job timeout. The copy
      # now has a cache of its own, saved at most once a day per branch, so a run fetches about a day of
      # changes (a run with no cache at all downloads the full NVD, which takes a few minutes).
      - name: Locate vulnerability database
        id: nvd-db
        run: |
          echo "DEPENDENCY_CHECK_DATA=$HOME/.cache/dependency-check" >> "$GITHUB_ENV"
          echo "cache-key=dependency-check-${{ runner.os }}-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore vulnerability database
        id: nvd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA }}
          key: ${{ steps.nvd-db.outputs.cache-key }}
          restore-keys: dependency-check-${{ runner.os }}-

      # Bounded, so a slow or unavailable NVD API fails here with a message instead of using up the job.
      - name: Update vulnerability database
        id: nvd-update
        timeout-minutes: 20
        run: ./mvnw --batch-mode --no-transfer-progress -Psecurity-scan -DdataDirectory="$DEPENDENCY_CHECK_DATA" dependency-check:update-only

      - name: Explain a failed vulnerability database update
        if: failure() && steps.nvd-update.outcome == 'failure'
        run: echo "::error title=NVD update failed::Updating the vulnerability database from the NVD API failed or took over 20 minutes, so the dependency audit did not run. This is not a vulnerability finding; the Update vulnerability database step shows the NVD responses. Re-run the job once the NVD API answers again."

      - name: Save vulnerability database
        if: steps.nvd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA }}
          key: ${{ steps.nvd-db.outputs.cache-key }}

      - name: Audit dependencies
        timeout-minutes: 10
        run: ./mvnw --batch-mode --no-transfer-progress -Psecurity-scan -DskipTests -DdataDirectory="$DEPENDENCY_CHECK_DATA" -DautoUpdate=false verify

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
