# Local development on http://localhost only. Never activate this profile on a reachable server:
# it disables HTTPS enforcement and the production configuration checks, and allows the
# built-in development MFA key.
security.allow-insecure-defaults=true
security.require-https=false
server.servlet.session.cookie.secure=false
security.mfa.encryption-key=${MFA_ENCRYPTION_KEY:local-development-only-change-me}
security.email-verification.required=${EMAIL_VERIFICATION_REQUIRED:false}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
