# na stronie O aplikacji; js.learn.<key> objaśnia opcję, a tytułem jest jej własna etykieta.
js.learning.explain=Co oznacza „{0}”?

# Tryb nauki: pojęcia StockWatch (także słowniczek na stronie O aplikacji)
js.glossary.watchlist.term=Lista obserwowanych
js.glossary.watchlist.text=Nazwana lista akcji, ETF-ów lub indeksów. Akcja może należeć do kilku list obserwowanych; alerty są wspólne, więc ten sam alert nigdy nie trafi do Ciebie dwukrotnie.
js.glossary.follow.term=Obserwowanie
js.glossary.follow.text=Włączenie alertów dla wybranego elementu: formacji na akcji, jej oceny technicznej albo transakcji insiderów i członków Kongresu. „Przestań obserwować” je wyłącza.
js.glossary.signal.term=Sygnał
js.glossary.signal.text=Formacja na wykresie (świecowa, fal Elliotta lub harmoniczna) wykryta na zamkniętej świecy obserwowanej akcji. Każdy sygnał pozostaje w sekcji Sygnały techniczne.
js.glossary.tickerAlert.term=Alert o transakcji
js.glossary.tickerAlert.text=Nowo zgłoszony zakup lub sprzedaż obserwowanej akcji przez insidera spółki lub członka Kongresu.
js.glossary.outlook.term=Ocena techniczna
js.glossary.outlook.text=Automatyczna ocena techniczna: jeden łączny odczyt — kupno, neutralnie lub sprzedaż — zbudowany z wielu wskaźników, osobno dla każdego interwału.
js.glossary.alert.term=Alert
js.glossary.alert.text=Powiadomienie o sygnale, zmianie oceny technicznej lub alercie o transakcji: w sekcji Najnowsze sygnały, a jeśli to włączysz, również e-mailem.
js.glossary.setupScore.term=Ocena sygnału
js.glossary.setupScore.text=Siła przesłanek technicznych wspierających formację w skali do 100. Nie jest to szansa na zyskowną transakcję.
js.glossary.tradeOutcome.term=Wynik transakcji
js.glossary.tradeOutcome.text=Zachowanie ceny po sygnale, mierzone przy użyciu stop loss, celu i limitu czasu formacji. Jest śledzone niezależnie od oceny.
js.glossary.signalStatus.term=Status
js.glossary.signalStatus.text=Etap cyklu życia sygnału: potencjalny lub wykryty, a następnie — gdy rozstrzygną to kolejne świece — potwierdzony, zanegowany lub wygasły.
js.glossary.demoTrade.term=Transakcja demo
js.glossary.demoTrade.text=Ćwiczebne kupno lub sprzedaż zapisane po bieżącym notowaniu. Nie jest składane żadne prawdziwe zlecenie i nie są przekazywane żadne pieniądze.
js.glossary.outlookChange.term=Zmiana oceny technicznej
js.glossary.outlookChange.text=Łączna ocena przeszła do innej klasy, na przykład z „neutralnie” do słabego sygnału kupna, między poprzednią a najnowszą zamkniętą świecą.
js.glossary.openPosition.term=Otwarta pozycja
js.glossary.openPosition.text=Transakcja demo, która nie została jeszcze zamknięta. Jej wartość zmienia się z najnowszą ceną, dopóki jej nie zamkniesz.

# Tryb nauki: podstawy rynku
js.glossary.candle.term=Świeca
js.glossary.candle.text=Jeden słupek na wykresie obejmujący jeden okres, na przykład dzień, tydzień lub miesiąc. Korpus sięga od ceny otwarcia do ceny zamknięcia, a cienkie cienie do maksimum i minimum. Świeca wzrostowa zamyka się powyżej otwarcia, spadkowa — poniżej.
js.glossary.interval.term=Interwał
js.glossary.interval.text=Okres, który obejmuje jedna świeca: dzień, tydzień lub miesiąc. Ta sama formacja na dłuższym interwale opisuje większy i wolniejszy ruch.
js.glossary.completedCandle.term=Zamknięta świeca
js.glossary.completedCandle.text=Świeca, której okres się zakończył, więc jej otwarcie, maksimum, minimum i zamknięcie są ostateczne. StockWatch analizuje tylko zamknięte świece, dlatego sygnał nie zmienia się, dopóki trwa notowanie bieżącego dnia, tygodnia lub miesiąca.
js.glossary.ticker.term=Ticker
js.glossary.ticker.text=Krótki kod, pod którym notowana jest akcja, ETF lub indeks, na przykład AAPL dla Apple.
js.glossary.direction.term=Kierunek
js.glossary.direction.text=Kierunek ruchu ceny, którego oczekuje sygnał. Kupno (sygnał wzrostowy) zakłada wzrost, sprzedaż / krótka sprzedaż (sygnał spadkowy) — spadek.
js.glossary.bullish.term=Wzrostowy
js.glossary.bullish.text=Wskazujący na wzrost cen. Formacja wzrostowa sugeruje, że przewagę zdobywają kupujący.
js.glossary.bearish.term=Spadkowy
js.glossary.bearish.text=Wskazujący na spadek cen. Formacja spadkowa sugeruje, że przewagę zdobywają sprzedający.
js.glossary.sellShort.term=Sprzedaż / krótka sprzedaż
js.glossary.sellShort.text=Sygnał spadkowy. Posiadaczowi akcji sugeruje sprzedaż; krótki sprzedający pożycza akcje i sprzedaje je, licząc, że odkupi je później taniej. Na pozycji krótkiej można stracić więcej, niż się zainwestowało.
js.glossary.trend.term=Trend
js.glossary.trend.text=Ogólny kierunek ceny w serii świec. Trend wzrostowy tworzy coraz wyższe szczyty i dołki, spadkowy — coraz niższe; trend boczny nie tworzy żadnych z nich.
js.glossary.priorTrend.term=Wcześniejszy trend
js.glossary.priorTrend.text=Ruch przed formacją. Formacja odwrócenia potrzebuje czegoś, co odwraca: wzrostowa liczy się tylko po spadku, spadkowa tylko po wzroście.
js.glossary.volume.term=Wolumen
js.glossary.volume.text=Liczba akcji, które zmieniły właściciela w czasie świecy. Ruch przy dużym wolumenie ma szerokie poparcie, ruch przy małym łatwiej odwrócić.
js.glossary.supportResistance.term=Wsparcie i opór
js.glossary.supportResistance.text=Poziomy cen, na których spadki już wcześniej się zatrzymywały (wsparcie) lub wzrosty wyhamowywały (opór). Czekają tam kupujący lub sprzedający, więc cena często reaguje, gdy się do nich zbliża.
js.glossary.closePrice.term=Zamknięcie
js.glossary.closePrice.text=Ostatnia cena w okresie świecy. Większość wskaźników i wszystkie reguły StockWatch korzystają z cen zamknięcia, bo po zamknięciu świecy są one ostateczne.
js.glossary.signalPeriod.term=Okres sygnału
js.glossary.signalPeriod.text=Dzień, tydzień lub miesiąc świecy, na której formacja się zakończyła i została wykryta.
js.glossary.technicalIndicator.term=Wskaźnik techniczny
js.glossary.technicalIndicator.text=Wartość obliczana z dawnych cen i wolumenu, na przykład RSI lub średnia krocząca, opisująca trend, momentum lub zmienność. Wskaźniki podsumowują to, co już się wydarzyło; nic nie wiedzą o wynikach spółki ani o wiadomościach.

# Tryb nauki: wskaźniki
js.glossary.rsi.term=RSI (wskaźnik siły względnej)
js.glossary.rsi.text=Miara momentum od 0 do 100 porównująca ostatnie wzrosty z ostatnimi spadkami. Powyżej 70 mówi się zwykle o wykupieniu, poniżej 30 o wyprzedaniu: ruch może być nadmierny i bliski przerwy.
js.glossary.cci.term=CCI (Commodity Channel Index)
js.glossary.cci.text=Mierzy, jak daleko cena typowa odeszła od swojej niedawnej średniej, w skali, w której większość odczytów mieści się między −100 a +100. Odczyty poza ±100 oznaczają wyjątkowo silny ruch w danym kierunku.
js.glossary.ema.term=EMA (wykładnicza średnia krocząca)
js.glossary.ema.text=Średnia ostatnich cen zamknięcia, w której najnowsze ceny mają największą wagę, więc reaguje szybciej niż średnia prosta. Szybka EMA powyżej wolnej wskazuje na trend wzrostowy.
js.glossary.sma.term=SMA (prosta średnia krocząca)
js.glossary.sma.text=Zwykła średnia cen zamknięcia z ustalonej liczby ostatnich świec. Długa SMA, na przykład z 200 świec, to popularny sposób oceny trendu długoterminowego.
js.glossary.macd.term=MACD
js.glossary.macd.text=Różnica między szybką a wolną EMA, porównywana z jej własną średnią, czyli linią sygnałową. MACD powyżej linii sygnałowej wskazuje na rosnące momentum wzrostowe, poniżej — na słabnące.
js.glossary.atr.term=ATR (średni prawdziwy zakres)
js.glossary.atr.text=Typowa rozpiętość ceny jednej świecy w ostatnich okresach, z uwzględnieniem luk cenowych. Mierzy zmienność, a nie kierunek, i często służy do ustawiania stop loss poza zwykłymi wahaniami ceny.
js.glossary.bollinger.term=Wstęgi Bollingera
js.glossary.bollinger.text=Średnia krocząca ze wstęgami odsuniętymi o ustaloną liczbę odchyleń standardowych w górę i w dół. Wstęgi rozszerzają się, gdy cena mocniej się waha, i zwężają, gdy się uspokaja; zamknięcie poza wstęgą oznacza, że cena mocno odeszła od średniej.
js.glossary.vwap.term=VWAP (średnia cena ważona wolumenem)
js.glossary.vwap.text=Średnia cena ważona tym, ile obrócono po każdej cenie, więc świece z dużym obrotem liczą się bardziej. Cena powyżej VWAP oznacza, że kupujący płacą więcej niż w przeciętnej transakcji z tego okresu.
js.glossary.relativeVolume.term=Wolumen względny
js.glossary.relativeVolume.text=Wolumen świecy podzielony przez średni wolumen ostatnich świec. 2× oznacza dwa razy większy obrót niż zwykle.
js.glossary.volumeProfile.term=Profil wolumenu
js.glossary.volumeProfile.text=Poziomy histogram pokazujący, ile obrócono na każdym poziomie ceny w zakresie świec. Pokazuje ceny, przy których odbywała się większość handlu.
js.glossary.anchoredVolumeProfile.term=Zakotwiczony profil wolumenu
js.glossary.anchoredVolumeProfile.text=Profil wolumenu, który zaczyna się od wybranej przez Ciebie świecy (kotwicy), na przykład ważnego dołka lub dnia z istotną wiadomością, i sięga do najnowszej świecy.
js.glossary.kde.term=Tryb profilu KDE
js.glossary.kde.text=Rysuje profil wolumenu jako gładką krzywą (estymator jądrowy gęstości) zamiast słupków, dzięki czemu główne obszary dużego obrotu są lepiej widoczne.
js.glossary.poc.term=POC (punkt kontroli)
js.glossary.poc.text=Cena, przy której w wybranym zakresie obrócono największym wolumenem.
js.glossary.vah.term=VAH (górna granica obszaru wartości)
js.glossary.vah.text=Górna krawędź przedziału cen obejmującego 70% obrotu.
js.glossary.val.term=VAL (dolna granica obszaru wartości)
js.glossary.val.text=Dolna krawędź przedziału cen obejmującego 70% obrotu.
js.glossary.marketRelative.term=Siła względem rynku
js.glossary.marketRelative.text=Wynik akcji w porównaniu z szerokim indeksem rynku w tych samych świecach. Akcja lepsza od rynku wykazuje siłę względną, słabsza — słabość względną.
js.glossary.donchian.term=Kanał Donchiana
js.glossary.donchian.text=Linie na najwyższym maksimum i najniższym minimum ostatnich świec, z linią środkową pomiędzy nimi. Zamknięcie poza kanałem to wybicie do nowego skrajnego poziomu w tym oknie.
js.glossary.keltner.term=Kanał Keltnera
js.glossary.keltner.text=EMA ze wstęgami odsuniętymi o ustaloną liczbę ATR w górę i w dół. Przypomina wstęgi Bollingera, ale opiera się na ATR, więc wstęgi są gładsze.
js.glossary.adx.term=ADX / DMI
js.glossary.adx.text=ADX (średni wskaźnik kierunkowy) mierzy siłę trendu, a nie jego kierunek; odczyty powyżej około 25 sugerują rynek w trendzie. +DI i −DI pokazują, czy przeważają ruchy w górę, czy w dół.
js.glossary.stochastic.term=Oscylator stochastyczny
js.glossary.stochastic.text=Pokazuje, w którym miejscu przedziału między maksimum a minimum ostatnich świec znajduje się zamknięcie, w skali od 0 do 100. Powyżej 80 to okolice górnej granicy, poniżej 20 — dolnej.
js.glossary.stochasticRsi.term=Stochastic RSI
js.glossary.stochasticRsi.text=Wzór oscylatora stochastycznego zastosowany do RSI zamiast do ceny; daje szybszą i czulszą miarę momentum od 0 do 100.
js.glossary.obv.term=OBV (wskaźnik równowagi wolumenu)
js.glossary.obv.text=Suma narastająca, która dodaje wolumen świecy zamkniętej wyżej i odejmuje wolumen świecy zamkniętej niżej. Rosnący OBV sugeruje presję kupujących za ruchem ceny.
js.glossary.mfi.term=MFI (wskaźnik przepływu pieniądza)
js.glossary.mfi.text=Odmiana RSI ważona wolumenem, w skali od 0 do 100. Powyżej 80 często odczytuje się jako wykupienie, poniżej 20 jako wyprzedanie.
js.glossary.trendState.term=Stan trendu
js.glossary.trendState.text=Panel oznaczający każdą świecę jako część trendu wzrostowego lub spadkowego, dzięki czemu od razu widać, kiedy trend się zmienił.

# Tryb nauki: plany transakcji i wyniki
js.glossary.entry.term=Wejście
js.glossary.entry.text=Cena, po której otwiera się modelowa transakcja. StockWatch zwykle wchodzi po cenie otwarcia świecy następującej po sygnale, bo sygnał jest znany dopiero po zamknięciu jego świecy.
js.glossary.stopLoss.term=Stop loss
js.glossary.stopLoss.text=Ustalona z góry cena wyjścia, która ogranicza stratę, gdy transakcja idzie źle: poniżej wejścia przy kupnie, powyżej przy sprzedaży / krótkiej sprzedaży. Cena może przeskoczyć stop luką, więc prawdziwa strata bywa większa.
js.glossary.profitTarget.term=Cel (take profit)
js.glossary.profitTarget.text=Cena, przy której modelowa transakcja realizuje zysk. Wynika z odległości do stop loss i stosunku zysku do ryzyka albo z projekcji samej formacji.
js.glossary.riskReward.term=Stosunek zysku do ryzyka (R:R)
js.glossary.riskReward.text=Ile transakcja może zyskać w porównaniu z tym, czym ryzykuje. 1:2 oznacza, że cel jest dwa razy dalej od wejścia niż stop loss. Im wyższy stosunek, tym mniej transakcji musi się udać, by wyjść na zero.
js.glossary.stopDistance.term=Odległość stop loss
js.glossary.stopDistance.text=Odległość stop loss od wejścia jako procent ceny wejścia: w przybliżeniu największa strata transakcji, jeśli stop zostanie osiągnięty, przed kosztami i lukami cenowymi.
js.glossary.timeStop.term=Wyjście czasowe
js.glossary.timeStop.text=Wyjście po ustalonej liczbie świec, jeśli nie osiągnięto ani stop loss, ani celu, by transakcja bez wyraźnego ruchu nie pozostawała otwarta bez końca.
js.glossary.tradeHorizon.term=Horyzont transakcji
js.glossary.tradeHorizon.text=Liczba zamkniętych świec, przez które modelowa transakcja może pozostać otwarta, zanim zamknie ją wyjście czasowe.
js.glossary.researchHorizon.term=Horyzont badawczy
js.glossary.researchHorizon.text=Okres utrzymywania pozycji, w którym ten rodzaj sygnału był najbardziej pouczający w testach historycznych. Pomaga odczytać sygnał, ale nie obiecuje przyszłych wyników.
js.glossary.modeledExit.term=Modelowe wyjście
js.glossary.modeledExit.text=Cena, po której zamknął się referencyjny plan transakcji, przed kosztami takimi jak prowizje i spready. Nie złożono żadnego prawdziwego zlecenia.
js.glossary.atrCircuitBreaker.term=Bezpiecznik ATR
js.glossary.atrCircuitBreaker.text=Kontrola bezpieczeństwa, która oznacza układ, którego stop loss byłby wyjątkowo daleko, mierząc to w ATR i procentach. Taki układ jest pokazywany tylko jako projekcja, a nie jako zakwalifikowana transakcja.
js.glossary.invalidationLevel.term=Poziom unieważnienia
js.glossary.invalidationLevel.text=Cena, która złamałaby strukturę formacji. Gdy cena zamknie się poza nią, odczyt formacji przestaje obowiązywać.
js.glossary.favorableMove.term=Ruch korzystny
js.glossary.favorableMove.text=Jak daleko cena poszła w kierunku sygnału po wejściu, mierzone na cenach zamknięcia.
js.glossary.adverseMove.term=Ruch niekorzystny
js.glossary.adverseMove.text=Jak daleko cena poszła przeciw sygnałowi po wejściu: obsunięcie, które musiałby przetrwać posiadacz pozycji.
js.glossary.directionalReturn.term=Stopa zwrotu w kierunku sygnału
js.glossary.directionalReturn.text=Zmiana ceny od zdarzenia liczona w kierunku transakcji: po zakupie dodatni jest wzrost, po sprzedaży dodatni jest spadek.
js.glossary.returnSinceFiling.term=Stopa zwrotu od zgłoszenia
js.glossary.returnSinceFiling.text=O ile zmieniła się cena od chwili, gdy zgłoszenie stało się publiczne, czyli od pierwszego momentu, w którym zwykli inwestorzy mogli na nie zareagować.
js.glossary.confluence.term=Konfluencja
js.glossary.confluence.text=Zgodność różnych przesłanek. Tutaj: sygnał innej rodziny formacji (świecowej, fal Elliotta lub harmonicznej) na tej samej akcji w ośmiu poprzednich świecach, który dodaje punkty, gdy się zgadza, i odejmuje, gdy jest przeciwny.

# Tryb nauki: status sygnału
js.glossary.statusPotential.term=Potencjalny
js.glossary.statusPotential.text=Kształt formacji już powstał, ale następna świeca musi go jeszcze potwierdzić, zanim zostanie uznany za wykryty.
js.glossary.statusDetected.term=Wykryty
js.glossary.statusDetected.text=Formacja spełniła wszystkie reguły na zamkniętej świecy. Wynik jest jeszcze otwarty: kolejne świece ją potwierdzą, zanegują albo pozwolą jej wygasnąć.
js.glossary.statusConfirmed.term=Potwierdzony
js.glossary.statusConfirmed.text=Cena poszła tak, jak sugerowała formacja: osiągnięto cel albo struktura fal Elliotta uzyskała ruch potwierdzający.
js.glossary.statusInvalidated.term=Zanegowany
js.glossary.statusInvalidated.text=Cena poszła przeciw formacji na tyle daleko, że ją złamała: osiągnięto stop loss albo struktura fal się rozpadła.
js.glossary.statusExpired.term=Wygasły
js.glossary.statusExpired.text=Ani potwierdzony, ani zanegowany w dozwolonej liczbie świec, więc plan transakcji zamknął się po upływie limitu czasu.
js.glossary.statusRejected.term=Odrzucony
js.glossary.statusRejected.text=Kształt formacji powstał, ale następna świeca go nie potwierdziła, więc formacja została odrzucona, zanim otworzył się jakikolwiek plan transakcji.

# Tryb nauki: formacje świecowe
js.glossary.candlestickPattern.term=Formacja świecowa
js.glossary.candlestickPattern.text=Rozpoznawalny układ jednej do trzech świec, na przykład młot lub objęcie, który inwestorzy odczytują jako znak możliwego odwrócenia lub kontynuacji. Formacje pokazują skłonności, a nie pewność.
js.glossary.candleAnatomy.term=Korpus i cienie
js.glossary.candleAnatomy.text=Korpus świecy sięga od otwarcia do zamknięcia; cienkie linie nad nim i pod nim, czyli cienie, sięgają maksimum i minimum. Długi dolny cień oznacza, że cena spadała w trakcie okresu, ale kupujący ją podnieśli.
js.glossary.pattern.DOJI.term=Doji
js.glossary.pattern.DOJI.text=Otwarcie i zamknięcie są prawie równe, więc korpus to tylko cienka kreska. Pokazuje równowagę kupujących i sprzedających; po silnym ruchu może ostrzegać, że ruch traci impet. StockWatch traktuje ją jako neutralną.
js.glossary.pattern.HAMMER.term=Młot
js.glossary.pattern.HAMMER.text=Mały korpus przy górze świecy i długi dolny cień, po spadkach. Sprzedający zepchnęli cenę w dół, ale do zamknięcia kupujący ją podnieśli: możliwe odwrócenie wzrostowe.
js.glossary.pattern.INVERTED_HAMMER.term=Odwrócony młot
js.glossary.pattern.INVERTED_HAMMER.text=Mały korpus przy dole świecy i długi górny cień, po spadkach. Kupujący próbowali podnieść cenę; jeśli następna świeca to potwierdzi, zapowiada to odwrócenie wzrostowe.
js.glossary.pattern.HANGING_MAN.term=Wisielec
js.glossary.pattern.HANGING_MAN.text=Wygląda jak młot (mały korpus u góry, długi dolny cień), ale pojawia się po wzrostach. Głęboka wyprzedaż w trakcie świecy ostrzega, że kupujący mogą słabnąć: możliwe odwrócenie spadkowe.
js.glossary.pattern.SHOOTING_STAR.term=Spadająca gwiazda
js.glossary.pattern.SHOOTING_STAR.text=Mały korpus przy dole świecy i długi górny cień, po wzrostach. Cena podskoczyła, a potem wróciła, więc sprzedający odrzucili wyższe ceny: możliwe odwrócenie spadkowe.
js.glossary.pattern.BULLISH_ENGULFING.term=Objęcie hossy
js.glossary.pattern.BULLISH_ENGULFING.text=Dwie świece po spadkach: spadkowa, a po niej większa wzrostowa, której korpus całkowicie obejmuje pierwszy korpus. Kupujący przejęli inicjatywę: możliwe odwrócenie wzrostowe.
js.glossary.pattern.BEARISH_ENGULFING.term=Objęcie bessy
js.glossary.pattern.BEARISH_ENGULFING.text=Dwie świece po wzrostach: wzrostowa, a po niej większa spadkowa, której korpus całkowicie obejmuje pierwszy korpus. Sprzedający przejęli inicjatywę: możliwe odwrócenie spadkowe.
js.glossary.pattern.PIERCING_LINE.term=Formacja przenikania
js.glossary.pattern.PIERCING_LINE.text=Po spadkach długą świecę spadkową zastępuje świeca wzrostowa, która otwiera się niżej, ale zamyka powyżej połowy pierwszego korpusu: możliwe odwrócenie wzrostowe.
js.glossary.pattern.DARK_CLOUD_COVER.term=Zasłona ciemnej chmury
js.glossary.pattern.DARK_CLOUD_COVER.text=Po wzrostach długą świecę wzrostową zastępuje świeca spadkowa, która otwiera się wyżej, ale zamyka poniżej połowy pierwszego korpusu: możliwe odwrócenie spadkowe.
js.glossary.pattern.BULLISH_HARAMI.term=Harami hossy
js.glossary.pattern.BULLISH_HARAMI.text=Po spadkach mała świeca mieści się całkowicie w korpusie poprzedniej długiej świecy spadkowej (harami po japońsku znaczy „w ciąży”). Sprzedaż traci siłę; to słabszy znak niż objęcie.
js.glossary.pattern.BEARISH_HARAMI.term=Harami bessy
js.glossary.pattern.BEARISH_HARAMI.text=Po wzrostach mała świeca mieści się całkowicie w korpusie poprzedniej długiej świecy wzrostowej. Kupno traci siłę; to słabszy znak niż objęcie.
js.glossary.pattern.BULLISH_HARAMI_CROSS.term=Krzyż harami hossy
js.glossary.pattern.BULLISH_HARAMI_CROSS.text=Harami hossy, w którym mała druga świeca jest doji: nagłe niezdecydowanie zaraz po silnym spadku, możliwe odwrócenie wzrostowe.
js.glossary.pattern.BEARISH_HARAMI_CROSS.term=Krzyż harami bessy
js.glossary.pattern.BEARISH_HARAMI_CROSS.text=Harami bessy, w którym mała druga świeca jest doji: nagłe niezdecydowanie zaraz po silnym wzroście, możliwe odwrócenie spadkowe.
js.glossary.pattern.MORNING_STAR.term=Gwiazda poranna
js.glossary.pattern.MORNING_STAR.text=Trzy świece po spadkach: długa spadkowa, mała gwiazda świadcząca o niezdecydowaniu, a potem silna wzrostowa, która zamyka się głęboko w pierwszym korpusie. Klasyczne odwrócenie wzrostowe.
js.glossary.pattern.EVENING_STAR.term=Gwiazda wieczorna
js.glossary.pattern.EVENING_STAR.text=Trzy świece po wzrostach: długa wzrostowa, mała gwiazda świadcząca o niezdecydowaniu, a potem silna spadkowa, która zamyka się głęboko w pierwszym korpusie. Klasyczne odwrócenie spadkowe.
js.glossary.pattern.THREE_WHITE_SOLDIERS.term=Trzech białych żołnierzy
js.glossary.pattern.THREE_WHITE_SOLDIERS.text=Trzy długie świece wzrostowe z rzędu, każda zamknięta wyżej, z małymi górnymi cieniami. Pokazuje stałe, zdecydowane kupowanie.
js.glossary.pattern.THREE_BLACK_CROWS.term=Trzy czarne wrony
js.glossary.pattern.THREE_BLACK_CROWS.text=Trzy długie świece spadkowe z rzędu, każda zamknięta niżej, z małymi dolnymi cieniami. Pokazuje stałe, zdecydowane sprzedawanie.

# Tryb nauki: fale Elliotta
js.glossary.elliottWave.term=Fale Elliotta
js.glossary.elliottWave.text=Teoria, według której ceny poruszają się w powtarzalnych falach napędzanych psychologią tłumu: pięć fal zgodnie z trendem (I–V), a potem trzy przeciw niemu (A–B–C). StockWatch szuka tych struktur między punktami zwrotnymi na wykresie.
js.glossary.impulseWave.term=Impuls (fale I–V)
js.glossary.impulseWave.text=Pięciofalowy ruch zgodny z trendem: fale I, III i V pchają cenę naprzód, fale II i IV ją cofają. Stałe reguły: fala II nigdy nie znosi całej fali I, fala III nie może być najkrótszą z fal impulsu, a fala IV nie wchodzi w zakres cen fali I.
js.glossary.correctiveWave.term=Korekta (A–B–C)
js.glossary.correctiveWave.text=Trzyfalowy ruch przeciw trendowi następujący po impulsie. Typowe kształty to zygzak (ostry ruch), korekta płaska (ruch boczny) i trójkąt.
js.glossary.subwave.term=Podfala
js.glossary.subwave.text=Każda fala Elliotta składa się z mniejszych fal niższego stopnia: fala impulsu dzieli się na pięć podfal, a fala korygująca zwykle na trzy.
js.glossary.pivot.term=Punkt zwrotny
js.glossary.pivot.text=Lokalny szczyt lub dołek, przy którym cena zawróciła. StockWatch potwierdza punkt zwrotny dopiero wtedy, gdy cena odwróci się o ustaloną wielokrotność ATR, a potem używa punktów zwrotnych jako końców fal i punktów formacji harmonicznych.
js.glossary.retracement.term=Zniesienie
js.glossary.retracement.text=Jaką część poprzedniego ruchu cena oddaje, w procentach. Zniesienie 61,8% wzrostu ze 100 do 200 to cofnięcie do około 138.
js.glossary.fibonacciRatio.term=Współczynniki Fibonacciego
js.glossary.fibonacciRatio.text=Proporcje takie jak 38,2%, 61,8%, 100% i 161,8%, wywodzące się z ciągu Fibonacciego i służące do porównywania długości jednego wahania ceny z innym.
js.glossary.fibonacciTargetZone.term=Strefa docelowa Fibonacciego
js.glossary.fibonacciTargetZone.text=Przedział cen wokół rozszerzenia Fibonacciego wcześniejszej fali, w którym ma się skończyć następna fala. To projekcja, a nie pewność.
js.glossary.elliottProjection.term=Projekcja
js.glossary.elliottProjection.text=Możliwa ścieżka następnej fali, zbudowana ze współczynników Fibonacciego wcześniejszych fal. Pokazuje, gdzie i mniej więcej kiedy fala mogłaby się skończyć, jeśli liczenie fal jest trafne; wraz z nowymi świecami jest korygowana lub odrzucana.
js.glossary.elliott.IMPULSE.term=Impuls Elliotta
js.glossary.elliott.IMPULSE.text=Zakończony pięciofalowy ruch (I–V) w jednym kierunku. Po impulsie teoria oczekuje trzyfalowej korekty przeciw niemu.
js.glossary.elliott.WAVE_II_END.term=Koniec fali II
js.glossary.elliott.WAVE_II_END.text=Fala II cofnęła część fali I, nie przekraczając jej początku. Jeśli liczenie jest trafne, następna będzie fala III, zwykle najdłuższa i najsilniejsza.
js.glossary.elliott.WAVE_III_END.term=Koniec fali III
js.glossary.elliott.WAVE_III_END.text=Najsilniejsza fala impulsu prawdopodobnie się zakończyła. Następna powinna być fala IV — płytsze lub boczne cofnięcie.
js.glossary.elliott.WAVE_IV_END.term=Koniec fali IV
js.glossary.elliott.WAVE_IV_END.text=Cofnięcie po fali III prawdopodobnie się zakończyło, nie wchodząc w zakres fali I. Następna powinna być fala V — ostatnie pchnięcie.
js.glossary.elliott.WAVE_V_END.term=Koniec fali V
js.glossary.elliott.WAVE_V_END.text=Ostatnia fala impulsu prawdopodobnie się zakończyła, domykając ruch pięciofalowy. Następna powinna być korekta przeciw niemu.
js.glossary.elliott.TRUNCATED_WAVE_V_END.term=Skrócona fala V
js.glossary.elliott.TRUNCATED_WAVE_V_END.text=Fala V zakończyła się, nie przekraczając końca fali III, co świadczy o wyczerpaniu trendu. Następna powinna być korekta.
js.glossary.elliott.CORRECTION.term=Korekta Elliotta
js.glossary.elliott.CORRECTION.text=Zakończony trzyfalowy ruch A–B–C przeciw poprzedniemu trendowi, na przykład zygzak. Po jego końcu większy trend powinien wrócić.
js.glossary.elliott.EXPANDED_FLAT_CORRECTION.term=Korekta płaska nieregularna (rozszerzona)
js.glossary.elliott.EXPANDED_FLAT_CORRECTION.text=Boczna korekta A–B–C, w której fala B wychodzi poza początek fali A, a fala C kończy się za końcem fali A. Potem większy trend powinien wrócić.
js.glossary.elliott.RUNNING_FLAT_CORRECTION.term=Korekta płaska pędząca
js.glossary.elliott.RUNNING_FLAT_CORRECTION.text=Korekta, w której fala B wychodzi poza początek fali A, ale fala C nie dociera do końca fali A, co świadczy o silnym trendzie, który prawdopodobnie wróci.

# Tryb nauki: formacje harmoniczne
js.glossary.harmonicPattern.term=Formacja harmoniczna
js.glossary.harmonicPattern.text=Pięciopunktowy układ cen (X, A, B, C, D), którego wahania muszą spełniać ustalone współczynniki Fibonacciego. Punkt D wyznacza miejsce, w którym cena ma zawrócić.
js.glossary.xabcd.term=Punkty X, A, B, C, D
js.glossary.xabcd.text=Pięć punktów zwrotnych formacji harmonicznej. X–A to pierwsze wahanie, B i C to kolejne, a D to punkt zakończenia, w którym oczekuje się odwrócenia. Każda formacja określa proporcje między tymi odcinkami.
js.glossary.prz.term=PRZ (potencjalna strefa odwrócenia)
js.glossary.prz.text=Obszar cen wokół punktu D, w którym zbiega się kilka pomiarów Fibonacciego formacji. Tam formacja oczekuje zwrotu ceny.
js.glossary.fibonacciTolerance.term=Tolerancja Fibonacciego
js.glossary.fibonacciTolerance.text=O ile zmierzony współczynnik może odbiegać od wartości idealnej i nadal się liczyć. Prawdziwe ceny rzadko trafiają dokładnie w 0,618, więc dopuszcza się niewielki margines.
js.glossary.pattern.HARMONIC_GARTLEY.term=Gartley
js.glossary.pattern.HARMONIC_GARTLEY.text=Pierwotna formacja harmoniczna, nazwana od H. M. Gartleya. B znosi około 61,8% odcinka XA, a D kończy się w okolicy 78,6% XA, wewnątrz zakresu X–A.
js.glossary.pattern.HARMONIC_BAT.term=Nietoperz
js.glossary.pattern.HARMONIC_BAT.text=Formacja opisana przez Scotta Carneya: płytkie B (38,2–50% XA) i głębokie zakończenie na 88,6% XA, blisko X, dzięki czemu poziom unieważnienia jest niedaleko.
js.glossary.pattern.HARMONIC_ALTERNATE_BAT.term=Nietoperz alternatywny
js.glossary.pattern.HARMONIC_ALTERNATE_BAT.text=Odmiana Nietoperza z jeszcze płytszym B (38,2% XA lub mniej) i punktem D wychodzącym poza X do około 113% XA.
js.glossary.pattern.HARMONIC_BUTTERFLY.term=Motyl
js.glossary.pattern.HARMONIC_BUTTERFLY.text=B znosi około 78,6% XA, a D wychodzi poza X do około 127% XA. Często tworzy się przy nowym szczycie lub dołku, po którym cena zawraca.
js.glossary.pattern.HARMONIC_CRAB.term=Krab
js.glossary.pattern.HARMONIC_CRAB.text=D sięga daleko poza X, do 161,8% XA, co czyni Kraba jedną z najbardziej skrajnych formacji harmonicznych; jego odcinek CD jest dużo dłuższy niż AB.
js.glossary.pattern.HARMONIC_DEEP_CRAB.term=Głęboki Krab
js.glossary.pattern.HARMONIC_DEEP_CRAB.text=Krab z głębokim B na 88,6% XA i punktem D na 161,8% XA.
js.glossary.pattern.HARMONIC_SHARK.term=Rekin
js.glossary.pattern.HARMONIC_SHARK.text=C wychodzi poza A, a potem D wraca, by przetestować okolice X. Często wyznacza koniec gwałtownego, rozciągniętego ruchu.
js.glossary.pattern.HARMONIC_CYPHER.term=Cypher
js.glossary.pattern.HARMONIC_CYPHER.text=C wychodzi poza A, a następnie D kończy się w okolicy 78,6% całego ruchu X–C. Podobnie jak Rekin mierzy D od odcinka X–C, a nie od XA.
js.glossary.pattern.HARMONIC_FIVE_ZERO.term=5-0
js.glossary.pattern.HARMONIC_FIVE_ZERO.text=Formacja zaczynająca się po nieudanym ruchu trendu: C sięga 161,8–224% AB, a potem D znosi około 50% BC. Ten poziom 50% to oczekiwany punkt zwrotny.
js.glossary.pattern.HARMONIC_AB_CD.term=AB=CD
js.glossary.pattern.HARMONIC_AB_CD.text=Najprostszy układ harmoniczny: dwa równe odcinki ceny, AB i CD, rozdzielone cofnięciem BC. Punkt D, w którym CD dorównuje długością AB, to oczekiwany punkt zwrotny.
js.glossary.pattern.HARMONIC_ALTERNATE_AB_CD.term=Alternatywny AB=CD
js.glossary.pattern.HARMONIC_ALTERNATE_AB_CD.text=AB=CD, w którym odcinek CD jest dłuższy niż AB i sięga 127% lub 161,8% jego długości. Punkt D to znowu oczekiwany punkt zwrotny.

# Tryb nauki: transakcje insiderów i członków Kongresu
js.glossary.insiderTrade.term=Transakcja insidera
js.glossary.insiderTrade.text=Zakup lub sprzedaż akcji spółki przez jej członków zarządu, dyrektorów lub akcjonariuszy z ponad 10% akcji. W USA muszą ją zgłosić do SEC na formularzu Form 4 w ciągu dwóch dni roboczych.
js.glossary.secFiling.term=Formularz SEC Form 4
js.glossary.secFiling.text=Oficjalne zgłoszenie w USA, w którym insider spółki ujawnia zmianę stanu posiadania: co kupił lub sprzedał, ile akcji, po jakiej cenie i ile ma po transakcji.
js.glossary.congressionalTrade.term=Transakcja członka Kongresu
js.glossary.congressionalTrade.text=Zakup lub sprzedaż akcji przez członka Kongresu USA albo jego małżonka lub dziecko na utrzymaniu. Na podstawie ustawy STOCK Act trzeba ją ujawnić w ciągu 45 dni, zwykle jako przedział kwoty, a nie dokładną kwotę.
js.glossary.filingDate.term=Data zgłoszenia
js.glossary.filingDate.text=Moment, w którym zgłoszenie transakcji zostało złożone i stało się publiczne. Może nastąpić kilka dni (insiderzy) lub tygodni (Kongres) po samej transakcji.
js.glossary.disclosureDate.term=Data ujawnienia
js.glossary.disclosureDate.text=Dzień, w którym transakcja została ujawniona publicznie. Wcześniej inni inwestorzy nie mogli o niej wiedzieć.

# Tryb nauki: ustawienia analizy
js.learn.analysis.rsiPeriod=Z ilu świec liczony jest RSI. Krótszy okres reaguje szybciej, ale daje więcej fałszywych sygnałów; najczęściej używa się 14.
js.learn.analysis.rsiBuyThreshold=RSI na tym poziomie lub niżej oznacza wyprzedanie i głosuje za kupnem, bo nadmierny spadek często kończy się odbiciem. Niższa wartość sprawia, że warunek występuje rzadziej.
js.learn.analysis.rsiSellThreshold=RSI na tym poziomie lub wyżej oznacza wykupienie i głosuje za sprzedażą / krótką sprzedażą, bo nadmierny wzrost często się zatrzymuje. Wyższa wartość sprawia, że warunek występuje rzadziej.
js.learn.analysis.cciPeriod=Z iloma świecami CCI porównuje cenę typową. Krótszy okres reaguje szybciej; często używa się 20.
js.learn.analysis.cciBuyThreshold=CCI na tym poziomie lub niżej — cena wyjątkowo daleko poniżej średniej — głosuje za kupnem. Klasyczna granica to −100.
js.learn.analysis.cciSellThreshold=CCI na tym poziomie lub wyżej — cena wyjątkowo daleko powyżej średniej — głosuje za sprzedażą / krótką sprzedażą. Klasyczna granica to +100.
js.learn.analysis.atrPeriod=Z ilu świec ATR uśrednia typową zmienność. ATR nigdy nie głosuje za kupnem ani sprzedażą; wyznacza skalę dla innych kontroli, na przykład odległości od wsparcia lub oporu.
js.learn.analysis.bollingerPeriod=Z ilu świec liczona jest średnia środkowa i szerokość wstęg Bollingera. Zwykle używa się 20.
js.learn.analysis.bollingerDeviation=O ile odchyleń standardowych wstęgi są odsunięte od linii środkowej. Zamknięcie na dolnej wstędze lub poniżej głosuje za kupnem, na górnej lub powyżej — za sprzedażą / krótką sprzedażą; szersze wstęgi są osiągane rzadziej. Zwykle używa się 2.
js.learn.analysis.fastEmaPeriod=Krótsza EMA w porównaniu trendu. Gdy jest powyżej wolnej EMA, ostatnie ceny rosną szybciej niż dłuższa średnia.
js.learn.analysis.slowEmaPeriod=Dłuższa EMA w porównaniu trendu. Porusza się wolniej i reprezentuje szerszy trend.
js.learn.analysis.emaThresholdPercent=O ile procent szybka EMA musi być powyżej wolnej, by głosować za kupnem, lub poniżej, by głosować za sprzedażą / krótką sprzedażą. Mniejsza różnica liczy się jako neutralna.
js.learn.analysis.longSmaPeriod=Długość długoterminowej SMA, często 200 świec. Cena powyżej niej wskazuje na długoterminowy trend wzrostowy, poniżej — na spadkowy.
js.learn.analysis.longSmaThresholdPercent=O ile procent cena musi być powyżej długiej SMA, by głosować za kupnem, lub poniżej, by głosować za sprzedażą / krótką sprzedażą. Mniejsza odległość liczy się jako neutralna.
js.learn.analysis.macdFastPeriod=Szybka EMA, z której powstaje linia MACD. Klasyczna wartość to 12.
js.learn.analysis.macdSlowPeriod=Wolna EMA odejmowana od szybkiej, by utworzyć linię MACD. Klasyczna wartość to 26.
js.learn.analysis.macdSignalPeriod=Długość linii sygnałowej, czyli EMA linii MACD. MACD powyżej linii sygnałowej wskazuje na rosnące momentum. Klasyczna wartość to 9.
js.learn.analysis.macdThresholdPercent=Jak duża musi być różnica między MACD a linią sygnałową, jako procent ceny, zanim zacznie głosować. Mniejsze różnice liczą się jako neutralne.
js.learn.analysis.volumePeriod=Z ilu świec liczony jest średni wolumen. Wolumen względny porównuje z tą średnią każdą świecę.
js.learn.analysis.relativeVolumeThreshold=Ile razy wolumen świecy musi przekraczać średnią, by głosowała zgodnie ze swoim kierunkiem: świeca wzrostowa za kupnem, spadkowa za sprzedażą / krótką sprzedażą. 1,5 oznacza 50% powyżej średniej.
js.learn.analysis.vwapPeriod=Z ilu świec liczony jest kroczący VWAP.
js.learn.analysis.vwapThresholdPercent=O ile procent cena musi być powyżej VWAP, by głosować za kupnem, lub poniżej, by głosować za sprzedażą / krótką sprzedażą. Mniejsza odległość liczy się jako neutralna.
js.learn.analysis.volumeProfilePeriod=Z ilu świec liczony jest profil wolumenu, gdy wyznacza punkt kontroli i obszar wartości.
js.learn.analysis.volumeProfileValueAreaFraction=Jaką część obrotu musi obejmować obszar wartości; zwyczajowo 0,70. Zamknięcie poniżej obszaru wartości głosuje za kupnem, powyżej — za sprzedażą / krótką sprzedażą.
js.learn.analysis.supportResistancePeriod=Z ilu świec wstecz StockWatch wyznacza najniższe minimum (wsparcie) i najwyższe maksimum (opór).
js.learn.analysis.supportResistanceAtrDistance=Jak blisko, w ATR, cena musi być wsparcia, by głosować za kupnem, lub oporu, by głosować za sprzedażą / krótką sprzedażą.
js.learn.analysis.marketRelativeThresholdPercent=O ile procent lepszy lub gorszy od indeksu rynku musi być wynik akcji, by uznać ją za względnie silną lub słabą.
js.learn.analysis.neutralScorePercent=Łączna ocena techniczna bliższa zera niż ta wartość jest oznaczana jako neutralna.
js.learn.analysis.moderateScorePercent=Od tej oceny, w dowolnym kierunku, wynik oznacza się jako umiarkowany sygnał kupna lub sprzedaży; między granicą neutralną a umiarkowaną jest to sygnał słaby.
js.learn.analysis.strongScorePercent=Od tej oceny, w dowolnym kierunku, wynik oznacza się jako silny sygnał kupna lub sprzedaży.
js.learn.analysis.elliottResolutionCandles=Ile zamkniętych świec po ostatnim końcu fali ma sygnał Elliotta na potwierdzenie lub zanegowanie, zanim wygaśnie.
js.learn.analysis.confirmationMovePercent=O ile procent późniejsze zamknięcie musi przesunąć się w kierunku sygnału, by sygnał Elliotta uznać za potwierdzony.
js.learn.analysis.invalidationMovePercent=O ile procent późniejsze zamknięcie musi przesunąć się przeciw sygnałowi, by sygnał Elliotta uznać za zanegowany.
js.learn.analysis.emailExpired=Wysyła e-mail, gdy formacja zostanie odrzucona, bo następna świeca jej nie potwierdziła, albo wygaśnie, bo minął jej limit czasu, zanim została potwierdzona lub zanegowana.
js.learn.analysis.scoreCandlestickSignals=Pozwala, by ostatnie sygnały świecowe na akcji dodawały punkty do łącznej oceny technicznej lub je odejmowały.
js.learn.analysis.scoreElliottSignals=Pozwala, by ostatnie sygnały fal Elliotta na akcji dodawały punkty do łącznej oceny technicznej lub je odejmowały.
js.learn.analysis.categoryBalancedHeadline=Nadaje każdej grupie wskaźników (momentum, trend, zmienność, wolumen, położenie ceny) tę samą wagę, by grupa z wieloma wskaźnikami nie zdominowała łącznej oceny.

# Tryb nauki: inne opcje
js.learn.scoring.points=Ile ze 100 punktów jest warta ta przesłanka w ocenie sygnału. Przesłanki odznaczone są pomijane, a każdy profil musi nadal sumować się do 100.
js.learn.candlestick.stopLossMethod=Jak ustawiany jest stop loss nowych transakcji świecowych: za własną strukturą formacji z dodatkowym buforem albo w stałej odległości procentowej od wejścia.
js.learn.candlestick.rewardRisk=Wielokrotność zysku dla celu. 2 oznacza, że cel jest dwa razy dalej od wejścia niż stop loss.
js.learn.candlestick.volatilityHistory=Z ilu świec historii ATR korzysta ocena, czy stop loss jest wyjątkowo daleko.
js.learn.signals.state=Nieprzeczytane to sygnały, których jeszcze nie otwarto. Aktywne to układy techniczne, które są nadal śledzone; zakończone zostały potwierdzone, zanegowane albo wygasły.
js.learn.stock.signalAlerts=Każdy przełącznik obserwuje jedną rodzinę formacji na jednym interwale w kierunku kupna lub sprzedaży / krótkiej sprzedaży. Po zastosowaniu zmian dostajesz alert, gdy tylko zostanie wykryty pasujący sygnał.
js.learn.stock.followOutlook=Dostawaj alert, gdy automatyczna ocena techniczna tej akcji zmieni klasę na obserwowanych interwałach.
js.learn.stock.followCongress=Dostawaj alert, gdy członek Kongresu ujawni transakcję na tej akcji.
js.learn.stock.followInsider=Dostawaj alert, gdy insider spółki zgłosi zakup lub sprzedaż tej akcji.
js.learn.stock.addToWatchlist=Dodaj akcję do jednej lub kilku list obserwowanych. Przejmie domyślne ustawienia obserwowania każdej listy, więc dostaniesz sygnały, które ta lista ma śledzić.
js.learn.stock.signalOverlays=Pokaż na wykresie sygnały znalezione przez StockWatch: formacje świecowe, struktury fal Elliotta i formacje harmoniczne.
js.learn.stock.chartView=Wybierz sposób rysowania cen: świece, słupki, linie, obszar i inne. Wolumen dodaje panel z obrotem. Wskaźniki otwierają pełną listę wskaźników.
js.learn.demo.size=„Tylko procentowo” śledzi stopę zwrotu bez kwoty. Liczba akcji ustala, ile akcji kupujesz; kwota wirtualna ustala, ile wirtualnych pieniędzy trafia do transakcji.
js.learn.watchlist.outlookFilter=Pokaż tylko tickery, których bieżąca ocena techniczna wskazuje wybrany kierunek: kupno, sprzedaż lub neutralnie.

