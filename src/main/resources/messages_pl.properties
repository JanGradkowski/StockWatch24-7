harmonic.heading=Definicje formacji harmonicznych
harmonic.intro=Ustaw reguły punktów zwrotnych i współczynniki Fibonacciego dla formacji harmonicznych. Ustawienia dotyczą wykresów dziennych, tygodniowych i miesięcznych.
harmonic.required=Obowiązkowe reguły formacji
harmonic.required.always=Kierunek, chronologiczna kolejność punktów zwrotnych, naprzemienność szczytów i dołków, zakończenie wewnętrzne lub zewnętrzne oraz granice punktów właściwe dla danej formacji zawsze pozostają regułami twardymi.
harmonic.required.softHard=Twardy współczynnik dopuszcza tylko podstawową tolerancję Fibonacciego. Miękki współczynnik może ją przekroczyć o dodatkowy margines reguł miękkich danej formacji, ale im bardziej się rozciąga, tym niższa ocena.
harmonic.required.affects=Zmiany dotyczą przyszłych alertów i nowo odtwarzanych nakładek. Zapisane sygnały zachowują pierwotną geometrię i uzasadnienie oceny.
harmonic.global.kicker=Wszystkie formacje harmoniczne
harmonic.global.heading=Domyślne punkty zwrotne i tolerancje
harmonic.global.help=Te wartości są wspólne dla każdej włączonej formacji harmonicznej i każdego obsługiwanego interwału.
harmonic.pattern.kicker=Definicja formacji
harmonic.detect=Wykrywaj tę formację
harmonic.detect.help=Po wyłączeniu formacja nie pojawia się na nakładkach, w rekonstrukcji historycznej ani w przyszłych alertach.
harmonic.hard.turnOff=Wyłącz, aby dopuścić odchylenia w ramach dodatkowego marginesu, kosztem niższej oceny.
harmonic.hard.default=Domyślnie: twarda
harmonic.soft.label=Dodatkowy margines reguł miękkich
harmonic.soft.description=Dodatkowe odchylenie ponad podstawową tolerancję dla grup współczynników, których przełącznik reguły twardej jest wyłączony.
harmonic.soft.effect=Większe wartości dopuszczają bardziej rozciągniętą geometrię, ale takie odchylenia obniżają ocenę formacji.
harmonic.ratios.kicker=Współczynniki
harmonic.ratios.heading=Definicja Fibonacciego
harmonic.ratios.help=Wartości to procenty odcinka ceny wskazanego w nazwie. Na przykład 61,8% oznacza 61,8% tego ruchu ceny.
harmonic.apply.heading=Zastosuj definicje formacji harmonicznych
harmonic.apply.help=Zapisz współczynniki, tolerancje i reguły obowiązkowe dla przyszłych wykryć.
harmonic.factory.headingNote=Ustawienia punktacji, wiadomości e-mail, wyglądu, formacji świecowych i fal Elliotta pozostaną bez zmian.
