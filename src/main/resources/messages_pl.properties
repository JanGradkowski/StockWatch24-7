# Harmonic patterns (pattern.HARMONIC_* are the signal names)
harmonic.pattern.GARTLEY=Gartley
pattern.HARMONIC_GARTLEY=Gartley
harmonic.pattern.GARTLEY.description=Punkt B na 0,618 XA, zakończenie na 0,786 XA oraz AB=CD lub alternatywne AB=CD 1,27.
harmonic.pattern.BAT=Nietoperz
pattern.HARMONIC_BAT=Nietoperz
