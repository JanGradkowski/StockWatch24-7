harmonic.hard.PRIMARY_B.label=Współczynnik punktu B jest regułą twardą
harmonic.hard.PRIMARY_B.description=Odrzuć, gdy punkt B przekracza podstawową tolerancję.
harmonic.hard.PRIMARY_B.shark.label=Współczynnik punktu C jest regułą twardą
harmonic.hard.PRIMARY_B.shark.description=Odrzuć, gdy punkt C przekracza podstawową tolerancję.
harmonic.hard.COMPLETION.label=Współczynnik zakończenia jest regułą twardą
harmonic.hard.COMPLETION.description=Odrzuć, gdy punkt D przekracza podstawową tolerancję.
harmonic.hard.SECONDARY_RATIOS.label=Współczynniki pomocnicze są regułą twardą
