candlestick.rewardRisk.intro=Ustaw jedną krotność zysku dla wszystkich interwałów. Wartość 2 oznacza, że cel jest dwa razy dalej od ceny wejścia niż ustawiony stop loss. Po zmianie ta sama wartość staje się też minimum dla planów transakcji fal Elliotta i formacji harmonicznych (domyślnie dla fal Elliotta 1:2 na interwale dziennym i 1:3 na tygodniowym lub miesięcznym, a dla formacji harmonicznych z częściowym zamknięciem pozycji 1:1,5 na dziennym i 1:2 na tygodniowym lub miesięcznym). Wejście następuje po cenie otwarcia świecy następującej po sygnale, a jeśli żaden poziom nie zostanie osiągnięty, pozycja jest zamykana na koniec zapisanego horyzontu.
