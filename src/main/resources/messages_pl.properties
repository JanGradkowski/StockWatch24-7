candlestick.structural.heading=Kontrola ryzyka strukturalnego
candlestick.structural.stops=Nowe plany stosują stop dokładnie tak, jak go ustawiono: cenę strukturalną przesuniętą o wybrany bufor procentowy albo stałą odległość procentową od ceny wejścia. Zbyt odległy stop lub zbyt mały zysk do najbliższego celu sprawia, że formacja jest tylko prognozą. Stopu nigdy nie przesuwa się do wnętrza struktury, aby sztucznie poprawić stosunek zysku do ryzyka.
candlestick.structural.limits=Limity dla interwału dziennego: 3 ATR / 12,5%. Tygodniowego: 4 ATR / 20%. Miesięcznego: 5 ATR / 30%. To wstępne zabezpieczenia, a nie szacowane prawdopodobieństwa powodzenia. Horyzont dla formacji świecowych wynosi 8 świec na interwale dziennym i tygodniowym oraz 6 na miesięcznym.
