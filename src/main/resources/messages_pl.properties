detection.rules.note=Struktura cen, minimalny ruch i świece kierunkowe.
detection.resetLabel.shared=Wspólne reguły wykrywania
detection.combining=Łączenie obu metod
detection.combining.help=Formacja kupna kwalifikuje się, gdy którykolwiek model wykryje trend spadkowy, a formacja sprzedaży (krótkiej sprzedaży) – gdy którykolwiek wykryje trend wzrostowy. Wynik „trend boczny” lub brak wyniku nie blokuje drugiego modelu, ale przeciwne wyniki kierunkowe wykluczają trend.
detection.position=Położenie w trendzie
detection.position.help=Ostatnie zamknięcie przed formacją musi wyraźnie wykraczać poza medianę zamknięć dokładnie tego odcinka trendu, który widać na wykresie. Margines jest dostosowany do zmienności, a nie ustalony na sztywno w procentach.
analysis.field.trendTerminalMedianDistanceAtr.help=Domyślnie: 0,25 ATR
detection.movement=Ruch ceny
detection.movement.help=Pierwsze i ostatnie zamknięcie w oknie reguły podstawowej muszą różnić się co najmniej o tyle procent.
analysis.field.trendMinimumMovePercent.help=Stosowany jednakowo dla trendów wzrostowych i spadkowych
detection.window=Okno świec
detection.window.help=Na przykład wartości 4 i 6 oznaczają, że co najmniej cztery zmiany zamknięcia lub struktury cen w ostatnich sześciu zamkniętych świecach muszą potwierdzać trend.
