js.sw.structure.motive=Impuls 1-2-3-4-5
js.sw.structure.diagonal=Trójkąt ukośny 1-2-3-4-5
js.sw.structure.leadingDiagonal=Początkowy trójkąt ukośny 1-2-3-4-5
js.sw.structure.endingDiagonal=Kończący trójkąt ukośny 1-2-3-4-5
js.sw.structure.zigzag=Korekta zygzak A-B-C
js.sw.structure.flat=Korekta płaska A-B-C
js.sw.structure.doubleZigzag=Podwójny zygzak W-X-Y
js.sw.structure.doubleThree=Podwójna trójka W-X-Y (korekta złożona)
js.sw.structure.tripleZigzag=Potrójny zygzak W-X-Y-X-Z
js.sw.structure.tripleThree=Potrójna trójka W-X-Y-X-Z (korekta złożona)
js.sw.structure.contractingTriangle=Trójkąt zwężający się A-B-C-D-E
js.sw.structure.barrierTriangle=Trójkąt barierowy A-B-C-D-E
js.sw.structure.expandingTriangle=Trójkąt rozszerzający się A-B-C-D-E
