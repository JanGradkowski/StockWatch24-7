# Chart indicators and the stock chart workbench
js.ind.SMA.name=Prosta średnia krocząca
js.ind.SMA.description=Średnia z ostatnich N wartości, każda z tą samą wagą.
js.ind.EMA.name=Wykładnicza średnia krocząca
js.ind.EMA.description=Średnia, która nadaje większą wagę najnowszym wartościom, więc reaguje szybciej niż SMA.
js.ind.WMA.name=Ważona średnia krocząca
js.ind.WMA.description=Średnia z liniowo rosnącymi wagami: najnowsza wartość liczy się najbardziej.
js.ind.VWMA.name=Średnia ważona wolumenem
