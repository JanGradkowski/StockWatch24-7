# Settings: detection
detection.heading=Wykrywanie trendu dla formacji świecowych
detection.intro=Wykrywanie trendu łączy strukturę cen z minimalnym ruchem i liczbą świec. Każda z metod może potwierdzić trend, ale przeciwne wyniki go wykluczają.
