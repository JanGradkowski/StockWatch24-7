# Elliott Wave rules
elliott.setting.minimumCandles.label=Minimalna liczba zamkniętych świec
elliott.setting.minimumCandles.description=Ile zamkniętych świec historii musi być dostępnych, zanim zacznie działać wykrywanie fal Elliotta.
elliott.setting.minimumCandles.effect=Zwiększ, aby wymagać szerszego kontekstu, zanim jakakolwiek struktura zostanie rozważona.
elliott.setting.minimumStructureQuality.label=Minimalna jakość struktury
elliott.setting.minimumStructureQuality.description=Najniższa wewnętrzna ocena jakości struktury, przy której trafia ona na wykres i do rekonstrukcji historycznej.
elliott.setting.minimumStructureQuality.effect=Zwiększ, aby ukryć słabsze, choć poprawne strukturalnie oznaczenia fal.
elliott.setting.minimumSignalConfidence.label=Minimalna pewność alertu
elliott.setting.minimumSignalConfidence.description=Minimalna pewność wymagana, aby wykryty punkt zwrotny Elliotta mógł wygenerować alert.
elliott.setting.minimumSignalConfidence.effect=Zwiększ, aby ograniczyć liczbę alertów bez usuwania słabszych nakładek z wykresu.
elliott.setting.maximumConfirmationLagCandles.label=Maksymalne opóźnienie potwierdzenia
elliott.setting.maximumConfirmationLagCandles.description=Ile zamkniętych świec może upłynąć od końca fali V lub C, zanim potwierdzenie odwrócenia zostanie uznane za spóźnione.
elliott.setting.maximumConfirmationLagCandles.effect=Zmniejsz, aby wymagać szybszego odwrócenia po punkcie końcowym.
elliott.setting.minimumImpulseSpanCandles.label=Minimalny czas trwania pełnego impulsu I–V
elliott.setting.minimumImpulseSpanCandles.description=Minimalna liczba świec danego interwału od początku impulsu do końca fali V.
elliott.setting.minimumImpulseSpanCandles.effect=Zwiększ, aby odrzucać zbyt skompresowane układy pięciu fal.
elliott.setting.minimumLegSpanCandles.label=Minimalna liczba świec w każdej fali
elliott.setting.minimumLegSpanCandles.description=Minimalna liczba świec danego interwału między dwoma kolejnymi punktami zwrotnymi Elliotta.
elliott.setting.minimumLegSpanCandles.effect=Zwiększ, aby bardzo krótkie wahania ceny nie stawały się osobnymi falami.
elliott.setting.breakoutBufferPercent.label=Bufor wybicia fali V
elliott.setting.breakoutBufferPercent.description=Jak daleko poza ekstremum fali III musi zamknąć się cena, aby wybicie rozwijającej się fali V zostało potwierdzone.
elliott.setting.breakoutBufferPercent.effect=Zwiększ, aby wymagać bardziej zdecydowanego wybicia poza falę III.
elliott.setting.reversalFloorPercent.label=Minimalny próg odwrócenia dla punktu zwrotnego
elliott.setting.reversalFloorPercent.description=Procent ceny używany jako minimalna odległość odwrócenia, gdy ATR jest mniejszy.
elliott.setting.reversalFloorPercent.effect=Zwiększ, aby wyznaczać mniej, ale większych punktów zwrotnych.
elliott.setting.pivotSensitivity1.label=Czułość punktów zwrotnych — najdrobniejsza
elliott.setting.pivotSensitivity1.description=Mnożnik ATR i progu odwrócenia dla najbardziej szczegółowego wyznaczania punktów zwrotnych.
elliott.setting.pivotSensitivity1.effect=Zwiększ, aby pomijać więcej drobnych wahań ceny.
elliott.setting.pivotSensitivity2.label=Czułość punktów zwrotnych — szczegółowa
elliott.setting.pivotSensitivity2.description=Mnożnik ATR i progu odwrócenia dla drugiego poziomu wyznaczania punktów zwrotnych.
elliott.setting.pivotSensitivity2.effect=Zwiększ, aby wymagać większych odwróceń na tym poziomie.
elliott.setting.pivotSensitivity3.label=Czułość punktów zwrotnych — szeroka
elliott.setting.pivotSensitivity3.description=Mnożnik ATR i progu odwrócenia dla trzeciego poziomu wyznaczania punktów zwrotnych.
elliott.setting.pivotSensitivity3.effect=Zwiększ, aby zachować tylko szersze odwrócenia.
elliott.setting.pivotSensitivity4.label=Czułość punktów zwrotnych — najszersza
elliott.setting.pivotSensitivity4.description=Mnożnik ATR i progu odwrócenia dla najmniej szczegółowego wyznaczania punktów zwrotnych.
elliott.setting.pivotSensitivity4.effect=Zwiększ, aby zachować tylko największe odwrócenia.
elliott.setting.maximumStructureOverlapPercent.label=Maksymalne nakładanie się wyświetlanych oznaczeń
elliott.setting.maximumStructureOverlapPercent.description=Część krótszej struktury, która może nakładać się na już wybraną strukturę Elliotta.
elliott.setting.maximumStructureOverlapPercent.effect=Zmniejsz, aby pokazywać mniej konkurencyjnych struktur na tym samym odcinku historii.
elliott.setting.waveTwoMaximumPercent.label=Bezwzględne maksymalne zniesienie fali II
elliott.setting.waveTwoMaximumPercent.description=Głębokość fali II mierzona względem fali I. Przy 100% fala II może zbliżyć się do początku fali I, ale nie może go przekroczyć.
elliott.setting.waveTwoMaximumPercent.effect=Zmniejsz, aby odrzucać głębsze fale II.
elliott.setting.waveTwoPreferredMinPercent.label=Preferowana fala II — minimum
elliott.setting.waveTwoPreferredMinPercent.description=Dolna granica szerszego zakresu fali II, w którym struktura jest oceniana normalnie.
elliott.setting.waveTwoPreferredMinPercent.effect=Zwiększ, aby płytkie zniesienia fali II oceniać jako słabsze.
elliott.setting.waveTwoPreferredMaxPercent.label=Preferowana fala II — maksimum
elliott.setting.waveTwoPreferredMaxPercent.description=Górna granica szerszego zakresu fali II, w którym struktura jest oceniana normalnie.
elliott.setting.waveTwoPreferredMaxPercent.effect=Zmniejsz, aby głębokie zniesienia fali II oceniać jako słabsze.
elliott.setting.waveTwoCommonMinPercent.label=Typowa strefa Fibonacciego fali II — minimum
elliott.setting.waveTwoCommonMinPercent.description=Dolna granica węższej strefy fali II, która otrzymuje dodatkową premię jakości.
elliott.setting.waveTwoCommonMinPercent.effect=Zwiększ, aby zawęzić typową strefę Fibonacciego od dołu.
elliott.setting.waveTwoCommonMaxPercent.label=Typowa strefa Fibonacciego fali II — maksimum
elliott.setting.waveTwoCommonMaxPercent.description=Górna granica węższej strefy fali II, która otrzymuje dodatkową premię jakości.
elliott.setting.waveTwoCommonMaxPercent.effect=Zmniejsz, aby zawęzić typową strefę Fibonacciego od góry.
elliott.setting.waveThreePreliminaryMinimumPercent.label=Rozwijająca się fala III względem fali I
elliott.setting.waveThreePreliminaryMinimumPercent.description=Przed zakończeniem fali V: długość fali III podzielona przez długość fali I. Niższe wartości obniżają pewność.
elliott.setting.waveThreePreliminaryMinimumPercent.effect=Zwiększ, aby wcześniej obniżać ocenę stosunkowo krótkiej rozwijającej się fali III.
elliott.setting.waveFourMaximumPercent.label=Bezwzględne maksymalne zniesienie fali IV
elliott.setting.waveFourMaximumPercent.description=Głębokość fali IV mierzona względem fali III.
elliott.setting.waveFourMaximumPercent.effect=Zmniejsz, aby odrzucać głębsze fale IV.
elliott.setting.waveFourPreferredMinPercent.label=Preferowana fala IV — minimum
elliott.setting.waveFourPreferredMinPercent.description=Dolna granica szerszego zakresu fali IV, w którym struktura jest oceniana normalnie.
elliott.setting.waveFourPreferredMinPercent.effect=Zwiększ, aby bardzo płytkie zniesienia fali IV oceniać jako słabsze.
elliott.setting.waveFourPreferredMaxPercent.label=Preferowana fala IV — maksimum
elliott.setting.waveFourPreferredMaxPercent.description=Górna granica szerszego zakresu fali IV, w którym struktura jest oceniana normalnie.
elliott.setting.waveFourPreferredMaxPercent.effect=Zmniejsz, aby głębokie zniesienia fali IV oceniać jako słabsze.
elliott.setting.waveFourCommonMinPercent.label=Typowa strefa Fibonacciego fali IV — minimum
elliott.setting.waveFourCommonMinPercent.description=Dolna granica węższej strefy premii dla fali IV.
elliott.setting.waveFourCommonMinPercent.effect=Zwiększ, aby zawęzić typową strefę Fibonacciego od dołu.
elliott.setting.waveFourCommonMaxPercent.label=Typowa strefa Fibonacciego fali IV — maksimum
elliott.setting.waveFourCommonMaxPercent.description=Górna granica węższej strefy premii dla fali IV.
elliott.setting.waveFourCommonMaxPercent.effect=Zmniejsz, aby zawęzić typową strefę Fibonacciego od góry.
elliott.setting.correctionMaximumPercent.label=Bezwzględne maksymalne zniesienie korekty A–B–C
elliott.setting.correctionMaximumPercent.description=Odległość od końca fali V do końca fali C podzielona przez cały ruch impulsu od początku do końca fali V.
elliott.setting.correctionMaximumPercent.effect=Zmniejsz, aby odrzucać korekty, które znoszą większą część poprzedniego impulsu.
elliott.setting.waveBMaximumRecoveryPercent.label=Maksymalne odbicie fali B
elliott.setting.waveBMaximumRecoveryPercent.description=Długość fali B od końca fali A podzielona przez długość fali A. Wartości powyżej 100% pozwalają fali B przekroczyć koniec fali V.
elliott.setting.waveBMaximumRecoveryPercent.effect=Zmniejsz, aby odrzucać więcej korekt płaskich nieregularnych i pędzących.
elliott.setting.correctionPreferredMinPercent.label=Preferowana pełna korekta — minimum
elliott.setting.correctionPreferredMinPercent.description=Dolna granica szerszego zakresu zniesienia ruchu od początku impulsu do końca fali V dla zakończonej korekty A–B–C.
elliott.setting.correctionPreferredMinPercent.effect=Zwiększ, aby obniżyć ocenę płytkich korekt.
elliott.setting.correctionPreferredMaxPercent.label=Preferowana pełna korekta — maksimum
elliott.setting.correctionPreferredMaxPercent.description=Górna granica szerszego zakresu zniesienia ruchu od początku impulsu do końca fali V dla zakończonej korekty A–B–C.
elliott.setting.correctionPreferredMaxPercent.effect=Zmniejsz, aby obniżyć ocenę głębokich korekt.
elliott.setting.correctionCommonMinPercent.label=Typowa strefa korekty — minimum
elliott.setting.correctionCommonMinPercent.description=Dolna granica węższej strefy premii dla zakończonej korekty.
elliott.setting.correctionCommonMinPercent.effect=Zwiększ, aby zawęzić typową strefę korekty od dołu.
elliott.setting.correctionCommonMaxPercent.label=Typowa strefa korekty — maksimum
elliott.setting.correctionCommonMaxPercent.description=Górna granica węższej strefy premii dla zakończonej korekty.
elliott.setting.correctionCommonMaxPercent.effect=Zmniejsz, aby zawęzić typową strefę korekty od góry.
elliott.setting.waveCPreferredMinPercent.label=Preferowana fala C względem fali A — minimum
elliott.setting.waveCPreferredMinPercent.description=Długość fali C podzielona przez długość fali A; 50% oznacza, że fala C ma połowę długości fali A.
elliott.setting.waveCPreferredMinPercent.effect=Zwiększ, aby obniżyć ocenę krótkich fal C.
elliott.setting.waveCPreferredMaxPercent.label=Preferowana fala C względem fali A — maksimum
elliott.setting.waveCPreferredMaxPercent.description=Górna granica szerszego zakresu proporcjonalnej fali C.
elliott.setting.waveCPreferredMaxPercent.effect=Zmniejsz, aby obniżyć ocenę wydłużonych fal C.
elliott.setting.waveCCommonMinPercent.label=Niemal równe C:A — minimum
elliott.setting.waveCCommonMinPercent.description=Dolna granica węższego zakresu, w którym fala C jest uznawana za niemal równą fali A.
elliott.setting.waveCCommonMinPercent.effect=Zwiększ, aby wymagać bliższej równości od dołu.
elliott.setting.waveCCommonMaxPercent.label=Niemal równe C:A — maksimum
elliott.setting.waveCCommonMaxPercent.description=Górna granica węższego zakresu, w którym fala C jest uznawana za niemal równą fali A.
elliott.setting.waveCCommonMaxPercent.effect=Zmniejsz, aby wymagać bliższej równości od góry.
elliott.setting.waveCAllowedMinPercent.label=Dopuszczalny stosunek C:A — minimum
elliott.setting.waveCAllowedMinPercent.description=Twarda dolna granica długości fali C, gdy włączony jest opcjonalny limit C:A.
elliott.setting.waveCAllowedMinPercent.effect=Zwiększ, aby odrzucać korekty z krótszą falą C.
elliott.setting.waveCAllowedMaxPercent.label=Dopuszczalny stosunek C:A — maksimum
elliott.setting.waveCAllowedMaxPercent.description=Twarda górna granica długości fali C, gdy włączony jest opcjonalny limit C:A.
elliott.setting.waveCAllowedMaxPercent.effect=Zmniejsz, aby odrzucać korekty z bardziej wydłużoną falą C.
elliott.setting.requireWaveFourNoOverlap.label=Wymagaj, aby fala IV nie zachodziła na falę I
elliott.setting.requireWaveFourNoOverlap.description=Po włączeniu fala IV musi pozostać za końcem fali I w kierunku impulsu.
elliott.setting.requireWaveFourNoOverlap.effect=To standardowa reguła impulsu (nie dotyczy trójkątów ukośnych).
elliott.setting.requireWaveThreeNotShortest.label=Wymagaj, aby fala III nie była najkrótsza
elliott.setting.requireWaveThreeNotShortest.description=Porównuje cenowe długości fal I, III i V, gdy znany jest koniec fali V.
elliott.setting.requireWaveThreeNotShortest.effect=Włączenie egzekwuje klasyczną twardą regułę Elliotta.
elliott.setting.allowWaveOneLongest.label=Zezwalaj, aby fala I była najdłuższą z fal impulsu
elliott.setting.allowWaveOneLongest.description=Po wyłączeniu fala I nie może być dłuższa jednocześnie od fal III i V. Opcja jest pomijana, gdy włączona jest surowsza reguła najkrótszej fali I.
elliott.setting.allowWaveOneLongest.effect=Włączenie odpowiada klasycznej teorii Elliotta: fala I może być najdłuższa, o ile fala III nie jest najkrótsza.
elliott.setting.requireWaveOneShortest.label=Wymagaj, aby fala I była najkrótszą z fal impulsu
elliott.setting.requireWaveOneShortest.description=Gdy znany jest koniec fali V, porównuje bezwzględne cenowe długości fal I, III i V. Fala I nie może być dłuższa ani od fali III, ani od fali V; równe długości są dopuszczalne.
elliott.setting.requireWaveOneShortest.effect=Włączenie odrzuca zakończone oznaczenia naruszające tę surową regułę i ma pierwszeństwo przed opcją „Zezwalaj, aby fala I była najdłuższą z fal impulsu”. Wykryć będzie znacznie mniej.
elliott.setting.allowWaveFiveLongest.label=Zezwalaj, aby fala V była najdłuższą z fal impulsu
elliott.setting.allowWaveFiveLongest.description=Po wyłączeniu fala V nie może być dłuższa jednocześnie od fal I i III.
elliott.setting.allowWaveFiveLongest.effect=Włączenie dopuszcza wydłużone piąte fale.
elliott.setting.allowTruncatedFifth.label=Zezwalaj na skróconą falę V
elliott.setting.allowTruncatedFifth.description=Skrócona wzrostowa fala V może zakończyć się na poziomie fali III lub poniżej; spadkowa — na poziomie fali III lub powyżej.
elliott.setting.allowTruncatedFifth.effect=Wyłącz, aby fala V musiała przekroczyć ekstremum fali III.
elliott.setting.requireWaveAWithinOrigin.label=Wymagaj, aby fala A nie przekroczyła początku impulsu
elliott.setting.requireWaveAWithinOrigin.description=Fala A może znosić impuls, ale nie może przekroczyć punktu, w którym zaczęła się fala I.
elliott.setting.requireWaveAWithinOrigin.effect=Włączenie zapobiega sytuacji, w której pierwsza fala korekty neguje cały poprzedni impuls.
elliott.setting.allowStandardCorrection.label=Zezwalaj na standardowe korekty A–B–C
elliott.setting.allowStandardCorrection.description=Fala B nie przekracza końca fali V.
elliott.setting.allowStandardCorrection.effect=Wyłącz, aby akceptować tylko włączone odmiany korekt płaskich.
elliott.setting.allowExpandedFlat.label=Zezwalaj na korekty płaskie nieregularne (rozszerzone)
elliott.setting.allowExpandedFlat.description=Fala B przekracza koniec fali V, a fala C przekracza ekstremum fali A.
elliott.setting.allowExpandedFlat.effect=Wyłącz, aby odrzucać korekty płaskie nieregularne.
elliott.setting.allowRunningFlat.label=Zezwalaj na korekty płaskie pędzące
elliott.setting.allowRunningFlat.description=Fala B przekracza koniec fali V, ale fala C nie przekracza ekstremum fali A.
elliott.setting.allowRunningFlat.effect=Wyłącz, aby odrzucać korekty płaskie pędzące.
elliott.setting.allowTriangles.label=Zezwalaj na podfale trójkąta A–B–C–D–E
elliott.setting.allowTriangles.description=Dopuszcza zwężające się trójkąty wewnątrz fali IV, fali B lub innych nadrzędnych fal korygujących.
elliott.setting.allowTriangles.effect=Wyłącz, aby pokazywać tylko trzyczęściowe podziały korekt.
elliott.setting.limitWaveCToARatio.label=Egzekwuj dopuszczalny zakres fali C względem fali A
elliott.setting.limitWaveCToARatio.description=Zmienia dopuszczalne minimum i maksimum C:A w twarde reguły odrzucenia zamiast wskazówek dotyczących jakości.
elliott.setting.limitWaveCToARatio.effect=Włącz, jeśli nieproporcjonalne fale C mają być całkowicie odrzucane.

# Settings: Elliott Waves
elliott.profile.shared=Ustawienia wspólne
elliott.profile.description=Te reguły dotyczą zamkniętych świec na każdym interwale analizy.
elliott.range.wave2Preferred=preferowane zniesienie fali II
elliott.range.wave2Common=typowe zniesienie fali II
elliott.range.wave4Preferred=preferowane zniesienie fali IV
elliott.range.wave4Common=typowe zniesienie fali IV
elliott.range.abcPreferred=preferowane zniesienie korekty A–B–C
elliott.range.abcCommon=typowe zniesienie korekty A–B–C
elliott.range.cToAPreferred=preferowany stosunek fali C do fali A
elliott.range.cToACommon=typowy stosunek fali C do fali A
elliott.range.cToAAllowed=dopuszczalny stosunek fali C do fali A
elliott.heading=Definicje wykrywania fal Elliotta
elliott.intro=Określ, jak zamknięte świece stają się punktami zwrotnymi, jak sprawdzany jest układ I–II–III–IV–V i które korekty A–B–C są akceptowane. Jedna wspólna definicja obowiązuje na wszystkich interwałach.
elliott.measured.retracement=Zniesienie (%)
elliott.measured.retracement.help=dzieli długość ruchu korygującego przez długość fali impulsu lub całego impulsu wskazanego w danej opcji.
elliott.measured.ratio=Stosunek (%)
elliott.measured.ratio.help=porównuje długości dwóch fal: 100% oznacza równą długość, 50% połowę, a 200% falę dwukrotnie dłuższą.
elliott.measured.atr=Krotność ATR (×)
elliott.measured.atr.help=określa, o ile cena musi się odwrócić, zanim powstanie nowy punkt zwrotny.
