harmonic.pattern.CRAB=Krab
pattern.HARMONIC_CRAB=Krab
harmonic.pattern.CRAB.description=Zakończenie na zewnętrznym poziomie 1,618 XA przy wyraźnie nierównych odcinkach AB i CD.
harmonic.pattern.SHARK=Rekin
pattern.HARMONIC_SHARK=Rekin
harmonic.pattern.SHARK.description=Oznaczany X-A-B-C-D jak pozostałe formacje (Carney zapisuje go jako 0-X-A-B-C); punkt D ponownie testuje X.
harmonic.pattern.CYPHER=Cypher
pattern.HARMONIC_CYPHER=Cypher
harmonic.pattern.CYPHER.description=Punkt C wychodzi poza A, a D kończy się w pobliżu zniesienia 0,786 odcinka XC.
harmonic.pattern.ALTERNATE_BAT=Nietoperz alternatywny
pattern.HARMONIC_ALTERNATE_BAT=Nietoperz alternatywny
harmonic.pattern.ALTERNATE_BAT.description=Punkt B na 0,382 XA lub niżej; wydłużony odcinek CD kończy się na 1,13 XA.
harmonic.pattern.DEEP_CRAB=Głęboki Krab
pattern.HARMONIC_DEEP_CRAB=Głęboki Krab
harmonic.pattern.DEEP_CRAB.description=Głębokie zniesienie w punkcie B na 0,886 XA i zakończenie na 1,618 XA.
harmonic.pattern.FIVE_ZERO=5-0
pattern.HARMONIC_FIVE_ZERO=5-0
harmonic.pattern.FIVE_ZERO.description=Nieudany impuls, rozszerzenie BC 1,618–2,24 i zniesienie BC o 50%.
harmonic.pattern.AB_CD=AB=CD
