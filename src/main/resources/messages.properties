# Learning mode: StockWatch words (also the About page glossary)
js.glossary.watchlist.term=Watchlist
js.glossary.watchlist.text=A named list of stocks, ETFs or indexes. A stock can be in several watchlists; alerts are shared, so you never receive the same alert twice.
js.glossary.follow.term=Follow
js.glossary.follow.text=Switching on alerts for something: a pattern on a stock, its outlook, or its insider and congressional trades. Unfollow switches them off.
js.glossary.signal.term=Signal
js.glossary.signal.text=A chart pattern (candlestick, Elliott Wave or harmonic) detected on a completed candle for a stock you follow. Every signal stays in Technical signals.
js.glossary.tickerAlert.term=Ticker alert
js.glossary.tickerAlert.text=A newly filed purchase or sale by a company insider or a member of Congress, for a stock you follow.
js.glossary.outlook.term=Outlook
js.glossary.outlook.text=The automated technical outlook: one overall buy, neutral or sell reading built from many indicators, per interval.
js.glossary.alert.term=Alert
js.glossary.alert.text=The notification you receive about a signal, outlook change or ticker alert: in Latest signals and, if switched on, by email.
js.glossary.setupScore.term=Setup score
js.glossary.setupScore.text=How much technical evidence supports a pattern, out of 100. It is not the chance of a profitable trade.
js.glossary.tradeOutcome.term=Trade outcome
js.glossary.tradeOutcome.text=What price did after the signal, measured with the pattern's stop, target and time limit. It is tracked separately from the score.
js.glossary.signalStatus.term=Status
js.glossary.signalStatus.text=Where a signal is in its life: potential or detected, then confirmed, invalidated or expired once later candles decide it.
js.glossary.demoTrade.term=Demo trade
js.glossary.demoTrade.text=A practice buy or sell recorded at the current quote. No real order is placed and no money moves.
js.glossary.outlookChange.term=Outlook change
js.glossary.outlookChange.text=The overall outlook moved into a different class, for example from neutral to a slight buy outlook, between the previous completed candle and the latest one.
js.glossary.openPosition.term=Open position
js.glossary.openPosition.text=A demo trade that has not been closed yet. Its value follows the latest price until you close it.

# Learning mode: market basics
js.glossary.candle.term=Candle (candlestick)
js.glossary.candle.text=One bar on the chart covering one period, such as a day, week or month. Its body spans the opening and closing price and its thin shadows reach the high and the low. A rising candle closes above its open; a falling one closes below it.
js.glossary.interval.term=Interval
js.glossary.interval.text=How much time each candle covers: daily, weekly or monthly. The same pattern on a longer interval describes a larger, slower move.
js.glossary.completedCandle.term=Completed candle
js.glossary.completedCandle.text=A candle whose period has ended, so its open, high, low and close are final. StockWatch analyses only completed candles, so a signal never changes while the current day, week or month is still trading.
js.glossary.ticker.term=Ticker
js.glossary.ticker.text=The short code a stock, ETF or index is listed under, such as AAPL for Apple.
js.glossary.direction.term=Direction
js.glossary.direction.text=Which way a signal expects the price to move. Buy (bullish) expects a rise; sell/short (bearish) expects a fall.
js.glossary.bullish.term=Bullish
js.glossary.bullish.text=Pointing to rising prices. A bullish pattern suggests that buyers are taking control.
js.glossary.bearish.term=Bearish
js.glossary.bearish.text=Pointing to falling prices. A bearish pattern suggests that sellers are taking control.
js.glossary.sellShort.term=Sell/Short
js.glossary.sellShort.text=A bearish signal. For a holder it suggests selling; a short seller borrows shares and sells them, hoping to buy them back cheaper later. A short position can lose more than the amount invested.
js.glossary.trend.term=Trend
js.glossary.trend.text=The general direction of price over a run of candles. An uptrend makes higher highs and higher lows, a downtrend lower highs and lower lows; a sideways market does neither.
js.glossary.priorTrend.term=Prior trend
js.glossary.priorTrend.text=The move before a pattern. A reversal pattern needs something to reverse: a bullish reversal only counts after a decline, a bearish one only after a rise.
js.glossary.volume.term=Volume
js.glossary.volume.text=How many shares changed hands during a candle. A move on high volume has broad participation; a move on low volume is easier to reverse.
js.glossary.supportResistance.term=Support and resistance
js.glossary.supportResistance.text=Price levels where falls have stopped before (support) or rises have stalled before (resistance). Buyers or sellers tend to wait there, so price often reacts when it comes close.
js.glossary.closePrice.term=Close
js.glossary.closePrice.text=The last price of a candle's period. Most indicators and all StockWatch rules use closing prices because they are final once the candle completes.
js.glossary.signalPeriod.term=Signal period
js.glossary.signalPeriod.text=The day, week or month of the candle on which the pattern was completed and detected.
js.glossary.technicalIndicator.term=Technical indicator
js.glossary.technicalIndicator.text=A calculation from past prices and volume, such as RSI or a moving average, that describes trend, momentum or volatility. Indicators summarise what has happened; they know nothing about earnings or news.

# Learning mode: indicators
js.glossary.rsi.term=RSI (Relative Strength Index)
js.glossary.rsi.text=A momentum gauge from 0 to 100 that compares recent gains with recent losses. Above 70 is usually called overbought and below 30 oversold: the move may be stretched and due for a pause.
js.glossary.cci.term=CCI (Commodity Channel Index)
js.glossary.cci.text=Measures how far the typical price is from its recent average, scaled so that most readings fall between −100 and +100. Readings beyond ±100 show an unusually strong move in that direction.
js.glossary.ema.term=EMA (exponential moving average)
js.glossary.ema.text=An average of recent closing prices that gives the newest prices the most weight, so it reacts faster than a simple average. A fast EMA above a slow EMA points to an uptrend.
js.glossary.sma.term=SMA (simple moving average)
js.glossary.sma.text=The plain average of the last closing prices over a set number of candles. A long SMA, such as 200 candles, is a common way to judge the long-term trend.
js.glossary.macd.term=MACD
js.glossary.macd.text=Moving Average Convergence Divergence: the gap between a fast and a slow EMA, compared with its own average, the signal line. MACD above its signal line points to strengthening upward momentum, below it to weakening.
js.glossary.atr.term=ATR (average true range)
js.glossary.atr.text=The typical size of one candle's price range over recent candles, including gaps. It measures volatility, not direction, and is often used to place stops beyond normal price noise.
js.glossary.bollinger.term=Bollinger Bands
js.glossary.bollinger.text=A moving average with bands a set number of standard deviations above and below it. The bands widen when prices swing more and narrow when they calm down; a close outside a band shows price is stretched from its average.
js.glossary.vwap.term=VWAP (volume-weighted average price)
js.glossary.vwap.text=The average price weighted by how much traded at each price, so busy candles count more. Price above VWAP means buyers are paying more than the average trade over the period.
js.glossary.relativeVolume.term=Relative volume
js.glossary.relativeVolume.text=A candle's volume divided by the average volume of recent candles. 2× means twice the usual trading activity.
js.glossary.volumeProfile.term=Volume profile
js.glossary.volumeProfile.text=A sideways histogram that shows how much volume traded at each price level over a range of candles. It reveals the prices where most of the trading happened.
js.glossary.anchoredVolumeProfile.term=Anchored volume profile
js.glossary.anchoredVolumeProfile.text=A volume profile that starts at a candle you choose (the anchor), such as a major low or a news day, and runs to the latest candle.
js.glossary.kde.term=KDE profile mode
js.glossary.kde.text=Draws the volume profile as a smooth curve (a kernel density estimate) instead of bars, so the main high-volume price areas stand out.
js.glossary.poc.term=POC (point of control)
js.glossary.poc.text=The price where the most volume traded in the selected range.
js.glossary.vah.term=VAH (value area high)
js.glossary.vah.text=The top of the price band that holds 70% of the traded volume.
js.glossary.val.term=VAL (value area low)
js.glossary.val.text=The bottom of the price band that holds 70% of the traded volume.
js.glossary.marketRelative.term=Market-relative strength
js.glossary.marketRelative.text=How the stock performed compared with its broad market index over the same candles. Beating the market is relative strength; lagging it is relative weakness.
js.glossary.donchian.term=Donchian Channel
js.glossary.donchian.text=Lines at the highest high and the lowest low of the last candles, with a middle line between them. A close beyond the channel is a breakout to a new extreme for that window.
js.glossary.keltner.term=Keltner Channel
js.glossary.keltner.text=An EMA with bands a set number of ATRs above and below it. Similar to Bollinger Bands, but based on ATR, so the bands are smoother.
js.glossary.adx.term=ADX / DMI
js.glossary.adx.text=ADX measures how strong a trend is, not its direction; readings above about 25 suggest a trending market. +DI and −DI show whether upward or downward moves dominate.
js.glossary.stochastic.term=Stochastic oscillator
js.glossary.stochastic.text=Shows where the close sits within the high–low range of recent candles, from 0 to 100. Above 80 is near the top of the range and below 20 near the bottom.
js.glossary.stochasticRsi.term=Stochastic RSI
js.glossary.stochasticRsi.text=The stochastic formula applied to RSI instead of price, which gives a faster, more sensitive momentum gauge from 0 to 100.
js.glossary.obv.term=OBV (on-balance volume)
js.glossary.obv.text=A running total that adds a candle's volume when it closes higher and subtracts it when it closes lower. A rising OBV suggests buying pressure behind the move.
js.glossary.mfi.term=MFI (Money Flow Index)
js.glossary.mfi.text=A volume-weighted cousin of RSI, from 0 to 100. Above 80 is often read as overbought and below 20 as oversold.
js.glossary.trendState.term=Trend state
js.glossary.trendState.text=A panel that labels each candle as part of an uptrend or a downtrend, so you can see at a glance when the trend changed.

# Learning mode: trade plans and results
js.glossary.entry.term=Entry
js.glossary.entry.text=The price at which the modelled trade opens. StockWatch normally enters at the open of the candle after the signal, because the signal is only known once its candle has closed.
js.glossary.stopLoss.term=Stop loss
js.glossary.stopLoss.text=A preset exit price that limits the loss if the trade goes wrong: below the entry for a buy, above it for a sell/short. Price can gap past a stop, so a real loss can be larger.
js.glossary.profitTarget.term=Target (take profit)
js.glossary.profitTarget.text=The price at which the modelled trade takes its profit. It comes from the stop distance and the risk-to-reward ratio, or from the pattern's own projection.
js.glossary.riskReward.term=Risk-to-reward (R:R)
js.glossary.riskReward.text=How much a trade can gain compared with what it risks. 1:2 means the target is twice as far from the entry as the stop. With a higher ratio, fewer trades need to win to break even.
js.glossary.stopDistance.term=Stop distance
js.glossary.stopDistance.text=How far the stop loss is from the entry, as a percentage of the entry price: roughly the most the trade loses if the stop is hit, before costs and price gaps.
js.glossary.timeStop.term=Time stop
js.glossary.timeStop.text=An exit after a set number of candles if neither the stop nor the target has been reached, so a trade that goes nowhere does not stay open forever.
js.glossary.tradeHorizon.term=Trade horizon
js.glossary.tradeHorizon.text=How many completed candles the modelled trade may stay open before the time stop closes it.
js.glossary.researchHorizon.term=Research horizon
js.glossary.researchHorizon.text=The holding period over which this kind of signal was most informative in historical tests. It helps you read the signal; it is not a promise about future returns.
js.glossary.modeledExit.term=Modelled exit
js.glossary.modeledExit.text=The price at which the reference trade plan closed, before costs such as commissions and spreads. No real order was placed.
js.glossary.atrCircuitBreaker.term=ATR circuit breaker
js.glossary.atrCircuitBreaker.text=A safety check that flags a setup whose stop would be unusually far away, measured in ATR and percent. Such a setup is shown as a projection only, not as a qualified trade.
js.glossary.invalidationLevel.term=Invalidation level
js.glossary.invalidationLevel.text=The price that would break the pattern's structure. Once price closes beyond it, the pattern's reading no longer holds.
js.glossary.favorableMove.term=Favourable move
js.glossary.favorableMove.text=How far price moved in the signal's direction after entry, measured on completed closes.
js.glossary.adverseMove.term=Adverse move
js.glossary.adverseMove.text=How far price moved against the signal after entry: the drawdown a holder would have had to sit through.
js.glossary.directionalReturn.term=Directional return
js.glossary.directionalReturn.text=The price change since the event, counted in the trade's direction: after a purchase a rise counts as positive, after a sale a fall counts as positive.
js.glossary.returnSinceFiling.term=Return since filing
js.glossary.returnSinceFiling.text=How much the price has moved since the filing became public, which is the first moment ordinary investors could act on it.
js.glossary.confluence.term=Confluence
js.glossary.confluence.text=Agreement between different kinds of evidence. Here: a signal from another pattern family (candlestick, Elliott Wave or harmonic) on the same stock in the preceding eight candles, which adds points when it agrees and removes them when it disagrees.

# Learning mode: signal status
js.glossary.statusPotential.term=Potential
js.glossary.statusPotential.text=The pattern's shape has formed, but the next candle still has to confirm it before it counts as detected.
js.glossary.statusDetected.term=Detected
js.glossary.statusDetected.text=The pattern passed all its rules on a completed candle. The result is still open: later candles will confirm it, invalidate it or let it expire.
js.glossary.statusConfirmed.term=Confirmed
js.glossary.statusConfirmed.text=Price followed through as the pattern suggested: the profit target was reached, or the Elliott structure gained its confirmation move.
js.glossary.statusInvalidated.term=Invalidated
js.glossary.statusInvalidated.text=Price moved against the pattern far enough to break it: the stop loss was hit or the wave structure failed.
js.glossary.statusExpired.term=Expired
js.glossary.statusExpired.text=Neither confirmed nor invalidated within the allowed number of candles, so the trade plan closed at its time limit.
js.glossary.statusRejected.term=Rejected
js.glossary.statusRejected.text=The pattern's shape formed, but the next candle did not confirm it, so it was dropped before any trade plan opened.

# Learning mode: candlestick patterns
js.glossary.candlestickPattern.term=Candlestick pattern
js.glossary.candlestickPattern.text=A recognisable shape of one to three candles, such as a hammer or an engulfing pattern, that traders read as a sign of a possible reversal or continuation. Patterns show tendencies, not certainties.
js.glossary.candleAnatomy.term=Body and shadows
js.glossary.candleAnatomy.text=A candle's body (the real body) spans its open and close; the thin lines above and below it, the shadows or wicks, reach the high and the low. A long lower shadow means price fell during the period but buyers pushed it back up.
js.glossary.pattern.DOJI.term=Doji
js.glossary.pattern.DOJI.text=The open and close are almost equal, so the body is just a thin line. It shows a standoff between buyers and sellers; after a strong move it can warn that the move is losing steam. StockWatch treats it as neutral.
js.glossary.pattern.HAMMER.term=Hammer
js.glossary.pattern.HAMMER.text=A small body near the top of the candle with a long lower shadow, after a decline. Sellers pushed price down, but buyers drove it back up by the close: a possible bullish reversal.
js.glossary.pattern.INVERTED_HAMMER.term=Inverted hammer
js.glossary.pattern.INVERTED_HAMMER.text=A small body near the bottom of the candle with a long upper shadow, after a decline. Buyers tried to push higher; if the next candle follows through, it hints at a bullish reversal.
js.glossary.pattern.HANGING_MAN.term=Hanging man
js.glossary.pattern.HANGING_MAN.text=Shaped like a hammer (small body on top, long lower shadow) but appearing after a rise. The deep sell-off within the candle warns that buyers may be tiring: a possible bearish reversal.
js.glossary.pattern.SHOOTING_STAR.term=Shooting star
js.glossary.pattern.SHOOTING_STAR.text=A small body near the bottom of the candle with a long upper shadow, after a rise. Price jumped and then fell back, so sellers rejected the higher prices: a possible bearish reversal.
js.glossary.pattern.BULLISH_ENGULFING.term=Bullish engulfing
js.glossary.pattern.BULLISH_ENGULFING.text=Two candles after a decline: a falling candle, then a larger rising candle whose body completely covers the first body. Buyers have overwhelmed sellers: a possible bullish reversal.
js.glossary.pattern.BEARISH_ENGULFING.term=Bearish engulfing
js.glossary.pattern.BEARISH_ENGULFING.text=Two candles after a rise: a rising candle, then a larger falling candle whose body completely covers the first body. Sellers have overwhelmed buyers: a possible bearish reversal.
js.glossary.pattern.PIERCING_LINE.term=Piercing line
js.glossary.pattern.PIERCING_LINE.text=After a decline, a long falling candle is followed by a rising candle that opens lower but closes above the middle of the first body: a possible bullish reversal.
js.glossary.pattern.DARK_CLOUD_COVER.term=Dark cloud cover
js.glossary.pattern.DARK_CLOUD_COVER.text=After a rise, a long rising candle is followed by a falling candle that opens higher but closes below the middle of the first body: a possible bearish reversal.
js.glossary.pattern.BULLISH_HARAMI.term=Bullish harami
js.glossary.pattern.BULLISH_HARAMI.text=After a decline, a small candle sits completely inside the body of the previous long falling candle (harami is Japanese for pregnant). Selling is losing force; it is a weaker sign than an engulfing pattern.
js.glossary.pattern.BEARISH_HARAMI.term=Bearish harami
js.glossary.pattern.BEARISH_HARAMI.text=After a rise, a small candle sits completely inside the body of the previous long rising candle. Buying is losing force; it is a weaker sign than an engulfing pattern.
js.glossary.pattern.BULLISH_HARAMI_CROSS.term=Bullish harami cross
js.glossary.pattern.BULLISH_HARAMI_CROSS.text=A bullish harami whose small second candle is a doji: sudden indecision right after a strong fall, a possible bullish reversal.
js.glossary.pattern.BEARISH_HARAMI_CROSS.term=Bearish harami cross
js.glossary.pattern.BEARISH_HARAMI_CROSS.text=A bearish harami whose small second candle is a doji: sudden indecision right after a strong rise, a possible bearish reversal.
js.glossary.pattern.MORNING_STAR.term=Morning star
js.glossary.pattern.MORNING_STAR.text=Three candles after a decline: a long falling candle, a small star candle showing indecision, then a strong rising candle that closes well into the first body. A classic bullish reversal.
js.glossary.pattern.EVENING_STAR.term=Evening star
js.glossary.pattern.EVENING_STAR.text=Three candles after a rise: a long rising candle, a small star candle showing indecision, then a strong falling candle that closes well into the first body. A classic bearish reversal.
js.glossary.pattern.THREE_WHITE_SOLDIERS.term=Three white soldiers
js.glossary.pattern.THREE_WHITE_SOLDIERS.text=Three long rising candles in a row, each closing higher with only small upper shadows. It shows steady, determined buying.
js.glossary.pattern.THREE_BLACK_CROWS.term=Three black crows
js.glossary.pattern.THREE_BLACK_CROWS.text=Three long falling candles in a row, each closing lower with only small lower shadows. It shows steady, determined selling.

# Learning mode: Elliott Waves
js.glossary.elliottWave.term=Elliott Wave
js.glossary.elliottWave.text=A theory that prices move in repeating waves driven by crowd psychology: five waves with the trend (I–V), then three against it (A–B–C). StockWatch looks for these structures between turning points on the chart.
js.glossary.impulseWave.term=Impulse (waves I–V)
js.glossary.impulseWave.text=The five-wave move in the direction of the trend: waves I, III and V push forward, waves II and IV pull back. Fixed rules: wave II never retraces all of wave I, wave III is never the shortest, and wave IV does not enter wave I's price range.
js.glossary.correctiveWave.term=Correction (A–B–C)
js.glossary.correctiveWave.text=The three-wave move against the trend that follows an impulse. Common shapes are the zigzag (a sharp move), the flat (a sideways move) and the triangle.
js.glossary.subwave.term=Subwave
js.glossary.subwave.text=Every Elliott wave is made of smaller waves of a lower degree: an impulse wave divides into five subwaves, a corrective wave usually into three.
js.glossary.pivot.term=Pivot (turning point)
js.glossary.pivot.text=A local high or low where price turned. StockWatch confirms a pivot only after price has reversed by a set multiple of ATR, then uses pivots as the endpoints of waves and harmonic points.
js.glossary.retracement.term=Retracement
js.glossary.retracement.text=How much of a previous move price gives back, as a percentage. A 61.8% retracement of a rise from 100 to 200 is a pullback to about 138.
js.glossary.fibonacciRatio.term=Fibonacci ratios
js.glossary.fibonacciRatio.text=Proportions such as 38.2%, 61.8%, 100% and 161.8%, taken from the Fibonacci sequence and used to compare the length of one price swing with another.
js.glossary.fibonacciTargetZone.term=Fibonacci target zone
js.glossary.fibonacciTargetZone.text=A price band around a Fibonacci extension of an earlier wave, where the next wave is expected to end. It is a projection, not a certainty.
js.glossary.elliottProjection.term=Projection
js.glossary.elliottProjection.text=A possible path for the next wave, built from Fibonacci ratios of the earlier waves. It shows where and roughly when the wave could end if the count is right, and is revised or dropped as new candles arrive.
js.glossary.elliott.IMPULSE.term=Elliott impulse
js.glossary.elliott.IMPULSE.text=A completed five-wave move (I–V) in one direction. After an impulse, the theory expects a three-wave correction against it.
js.glossary.elliott.WAVE_II_END.term=End of wave II
js.glossary.elliott.WAVE_II_END.text=Wave II pulled back part of wave I without passing its start. If the count is right, wave III, usually the longest and strongest, comes next.
js.glossary.elliott.WAVE_III_END.term=End of wave III
js.glossary.elliott.WAVE_III_END.text=The strongest wave of the impulse has probably ended. Wave IV, a shallower or sideways pullback, is expected next.
js.glossary.elliott.WAVE_IV_END.term=End of wave IV
js.glossary.elliott.WAVE_IV_END.text=The pullback after wave III has probably ended without entering wave I's range. Wave V, the final push, is expected next.
js.glossary.elliott.WAVE_V_END.term=End of wave V
js.glossary.elliott.WAVE_V_END.text=The last wave of the impulse has probably ended, completing the five-wave move. A correction against it is expected next.
js.glossary.elliott.TRUNCATED_WAVE_V_END.term=Truncated wave V
js.glossary.elliott.TRUNCATED_WAVE_V_END.text=Wave V ended without moving past the end of wave III, a sign of an exhausted trend. A correction is expected next.
js.glossary.elliott.CORRECTION.term=Elliott correction
js.glossary.elliott.CORRECTION.text=A completed three-wave A–B–C move against the previous trend, such as a zigzag. When it ends, the larger trend is expected to resume.
js.glossary.elliott.EXPANDED_FLAT_CORRECTION.term=Expanded flat
js.glossary.elliott.EXPANDED_FLAT_CORRECTION.text=A sideways A–B–C correction in which wave B goes past the start of wave A and wave C ends beyond the end of wave A. Afterwards the larger trend is expected to resume.
js.glossary.elliott.RUNNING_FLAT_CORRECTION.term=Running flat
js.glossary.elliott.RUNNING_FLAT_CORRECTION.text=A correction in which wave B goes past the start of wave A but wave C stops short of the end of wave A, a sign of a strong underlying trend that is likely to resume.

# Learning mode: harmonic patterns
js.glossary.harmonicPattern.term=Harmonic pattern
js.glossary.harmonicPattern.text=A five-point price shape (X, A, B, C, D) whose swings must match set Fibonacci ratios. Point D marks where price is expected to turn.
js.glossary.xabcd.term=Points X, A, B, C, D
js.glossary.xabcd.text=The five turning points of a harmonic pattern. X–A is the first swing, B and C are the swings that follow, and D is the completion point where a reversal is expected. Each pattern sets the ratios between these legs.
js.glossary.prz.term=PRZ (potential reversal zone)
js.glossary.prz.text=The price area around point D where several Fibonacci measurements of the pattern meet. It is where the pattern expects price to turn.
js.glossary.fibonacciTolerance.term=Fibonacci tolerance
js.glossary.fibonacciTolerance.text=How far a measured ratio may miss its ideal value and still count. Real prices rarely hit 0.618 exactly, so a small margin is allowed.
js.glossary.pattern.HARMONIC_GARTLEY.term=Gartley
js.glossary.pattern.HARMONIC_GARTLEY.text=The original harmonic pattern, named after H. M. Gartley. B retraces about 61.8% of XA and D completes at about 78.6% of XA, inside the X–A range.
js.glossary.pattern.HARMONIC_BAT.term=Bat
js.glossary.pattern.HARMONIC_BAT.text=A pattern defined by Scott Carney with a shallow B (38.2–50% of XA) and a deep completion at 88.6% of XA, close to X, which keeps the invalidation point near.
js.glossary.pattern.HARMONIC_ALTERNATE_BAT.term=Alternate Bat
js.glossary.pattern.HARMONIC_ALTERNATE_BAT.text=A Bat variant with an even shallower B (38.2% of XA or less) and D extending past X to about 113% of XA.
js.glossary.pattern.HARMONIC_BUTTERFLY.term=Butterfly
js.glossary.pattern.HARMONIC_BUTTERFLY.text=B retraces about 78.6% of XA and D extends beyond X to about 127% of XA. It often forms at a new high or low that then reverses.
js.glossary.pattern.HARMONIC_CRAB.term=Crab
js.glossary.pattern.HARMONIC_CRAB.text=D extends far beyond X, to 161.8% of XA, which makes the Crab one of the most extreme harmonic patterns; its CD leg is much longer than AB.
js.glossary.pattern.HARMONIC_DEEP_CRAB.term=Deep Crab
js.glossary.pattern.HARMONIC_DEEP_CRAB.text=A Crab with a deep B at 88.6% of XA and D at 161.8% of XA.
js.glossary.pattern.HARMONIC_SHARK.term=Shark
js.glossary.pattern.HARMONIC_SHARK.text=C overshoots beyond A, and D then comes back to retest the area of X. It often marks the end of a sharp, stretched move.
js.glossary.pattern.HARMONIC_CYPHER.term=Cypher
js.glossary.pattern.HARMONIC_CYPHER.text=C extends beyond A, then D completes near 78.6% of the whole X–C move. Like the Shark, it measures D from the X–C leg rather than from XA.
js.glossary.pattern.HARMONIC_FIVE_ZERO.term=5-0
js.glossary.pattern.HARMONIC_FIVE_ZERO.text=A pattern that starts after a failed trend move: C extends 161.8–224% of AB, then D retraces about 50% of BC. That 50% level is the expected turning point.
js.glossary.pattern.HARMONIC_AB_CD.term=AB=CD
js.glossary.pattern.HARMONIC_AB_CD.text=The simplest harmonic shape: two equal price legs, AB and CD, separated by a pullback BC. D, where CD matches AB in length, is the expected turning point.
js.glossary.pattern.HARMONIC_ALTERNATE_AB_CD.term=Alternate AB=CD
js.glossary.pattern.HARMONIC_ALTERNATE_AB_CD.text=An AB=CD whose CD leg is longer than AB, extending to 127% or 161.8% of it. D is again the expected turning point.

# Learning mode: insider and congressional trades
js.glossary.insiderTrade.term=Insider trade
js.glossary.insiderTrade.text=A purchase or sale of a company's shares by its own officers, directors or owners of more than 10% of the shares. In the US they must report it to the SEC on Form 4 within two business days.
js.glossary.secFiling.term=SEC Form 4
js.glossary.secFiling.text=The official US report in which a company insider discloses a change in holdings: what was bought or sold, how many shares, at what price, and what is owned afterwards.
js.glossary.congressionalTrade.term=Congressional trade
js.glossary.congressionalTrade.text=A stock purchase or sale by a member of the US Congress or their spouse or dependent child. Under the STOCK Act it must be disclosed within 45 days, usually as a value range rather than an exact amount.
js.glossary.filingDate.term=Filing date
js.glossary.filingDate.text=When the report of the trade was filed and became public. It can come days (insiders) or weeks (Congress) after the trade itself.
js.glossary.disclosureDate.term=Disclosure date
js.glossary.disclosureDate.text=The day the trade was disclosed to the public. Before that day, other investors could not have known about it.

# Learning mode: analysis settings
js.learn.analysis.rsiPeriod=How many candles RSI looks back over. Shorter periods react faster but give more false alarms; 14 is the common choice.
js.learn.analysis.rsiBuyThreshold=RSI at or below this level counts as oversold and votes buy, on the idea that a stretched fall tends to bounce. A lower value makes the condition rarer.
js.learn.analysis.rsiSellThreshold=RSI at or above this level counts as overbought and votes sell/short, on the idea that a stretched rise tends to pause. A higher value makes the condition rarer.
js.learn.analysis.cciPeriod=How many candles CCI compares the typical price against. Shorter periods react faster; 20 is a common choice.
js.learn.analysis.cciBuyThreshold=CCI at or below this level, price unusually far below its average, votes buy. −100 is the classic boundary.
js.learn.analysis.cciSellThreshold=CCI at or above this level, price unusually far above its average, votes sell/short. +100 is the classic boundary.
js.learn.analysis.atrPeriod=How many candles ATR averages to measure typical volatility. ATR never votes buy or sell; it sets the scale for checks such as the distance to support or resistance.
js.learn.analysis.bollingerPeriod=How many candles the Bollinger Bands use for their middle average and their width. 20 is the usual setting.
js.learn.analysis.bollingerDeviation=How many standard deviations the bands sit from the middle line. A close at or below the lower band votes buy, at or above the upper band sell/short; wider bands are reached less often. 2 is the usual setting.
js.learn.analysis.fastEmaPeriod=The shorter EMA in the trend comparison. When it is above the slow EMA, recent prices are rising faster than the longer average.
js.learn.analysis.slowEmaPeriod=The longer EMA in the trend comparison. It moves more slowly and stands for the broader trend.
js.learn.analysis.emaThresholdPercent=How far, in percent, the fast EMA must be above the slow EMA to vote buy, or below it to vote sell/short. Anything closer counts as neutral.
js.learn.analysis.longSmaPeriod=The length of the long-term SMA, often 200 candles. Price above it points to a long-term uptrend, below it to a downtrend.
js.learn.analysis.longSmaThresholdPercent=How far, in percent, price must be above the long SMA to vote buy, or below it to vote sell/short. Anything closer counts as neutral.
js.learn.analysis.macdFastPeriod=The fast EMA used to build the MACD line. The classic setting is 12.
js.learn.analysis.macdSlowPeriod=The slow EMA subtracted from the fast one to build the MACD line. The classic setting is 26.
js.learn.analysis.macdSignalPeriod=The length of the signal line, an EMA of the MACD line. MACD above its signal line points to rising momentum. The classic setting is 9.
js.learn.analysis.macdThresholdPercent=How large the gap between MACD and its signal line must be, as a percentage of price, before it votes. Smaller gaps count as neutral.
js.learn.analysis.volumePeriod=How many candles the average volume covers. Relative volume compares each candle with this average.
js.learn.analysis.relativeVolumeThreshold=How many times the average volume a candle needs to vote in its own direction: a rising candle votes buy, a falling one sell/short. 1.5 means 50% above average.
js.learn.analysis.vwapPeriod=How many candles the rolling VWAP covers.
js.learn.analysis.vwapThresholdPercent=How far, in percent, price must be above VWAP to vote buy, or below it to vote sell/short. Anything closer counts as neutral.
js.learn.analysis.volumeProfilePeriod=How many candles the volume profile covers when it finds the point of control and the value area.
js.learn.analysis.volumeProfileValueAreaFraction=The share of traded volume the value area must hold; 0.70 is the usual convention. A close below the value area votes buy, above it sell/short.
js.learn.analysis.supportResistancePeriod=How many candles back StockWatch looks for the lowest low (support) and the highest high (resistance).
js.learn.analysis.supportResistanceAtrDistance=How close, in ATRs, price must be to support to vote buy, or to resistance to vote sell/short.
js.learn.analysis.marketRelativeThresholdPercent=How much better or worse than its market index the stock must have done, in percent, to count as relatively strong or weak.
js.learn.analysis.neutralScorePercent=An overall outlook score closer to zero than this is labelled neutral.
js.learn.analysis.moderateScorePercent=From this score, in either direction, the outlook is labelled moderate buy or moderate sell; between the neutral and moderate boundaries it is a slight one.
js.learn.analysis.strongScorePercent=From this score, in either direction, the outlook is labelled strong buy or strong sell.
js.learn.analysis.elliottResolutionCandles=How many completed candles after the latest wave endpoint an Elliott signal has to be confirmed or invalidated before it expires.
js.learn.analysis.confirmationMovePercent=How far, in percent, a later close must move in the signal's direction for the Elliott signal to count as confirmed.
js.learn.analysis.invalidationMovePercent=How far, in percent, a later close must move against the signal for the Elliott signal to count as invalidated.
js.learn.analysis.emailExpired=Emails you when a pattern is rejected because the next candle did not confirm it, or expires because its time limit ran out before it was confirmed or invalidated.
js.learn.analysis.scoreCandlestickSignals=Lets recent candlestick signals on the stock add to or subtract from the overall outlook score.
js.learn.analysis.scoreElliottSignals=Lets recent Elliott Wave signals on the stock add to or subtract from the overall outlook score.
js.learn.analysis.categoryBalancedHeadline=Gives each indicator group (momentum, trend, volatility, volume, price location) the same weight, so a group with many indicators cannot dominate the overall outlook.

# Learning mode: other options
js.learn.scoring.points=How many of the 100 points this piece of evidence is worth in the setup score. Unticked evidence is left out, and every profile must still total 100.
js.learn.candlestick.stopLossMethod=How the stop loss of new candlestick trades is placed: beyond the pattern's own structure with an extra buffer, or a fixed percentage from the entry.
js.learn.candlestick.rewardRisk=The reward multiple for the profit target. 2 places the target twice as far from the entry as the stop loss.
js.learn.candlestick.volatilityHistory=How many candles of ATR history are used to judge whether a stop is unusually far away.
js.learn.signals.state=Unread signals have not been opened yet. Active signals are technical setups that are still being tracked; completed ones have been confirmed, invalidated or have expired.
js.learn.stock.signalAlerts=Each switch follows one pattern family on one interval in the buy or sell/short direction. After you apply the changes, you get an alert whenever a matching signal is detected.
js.learn.stock.followOutlook=Get an alert whenever the automated technical outlook for this stock changes class on the intervals you follow.
js.learn.stock.followCongress=Get an alert whenever a member of Congress discloses a trade in this stock.
js.learn.stock.followInsider=Get an alert whenever a company insider files a purchase or sale of this stock.
js.learn.stock.addToWatchlist=Add the stock to one or more of your watchlists. It takes on each list's default follows, so you get the signals that list is set to watch.
js.learn.stock.signalOverlays=Show the signals StockWatch found on this chart: candlestick patterns, Elliott Wave structures and harmonic formations.
js.learn.stock.chartView=Choose how prices are drawn: candles, bars, lines, area and more. Volume adds a pane with the traded volume. Indicators open the full indicator list.
js.learn.demo.size=Percentage only tracks the return without an amount. Quantity sets a number of shares; virtual amount sets how much play money goes in.
js.learn.watchlist.outlookFilter=Show only the tickers whose current outlook leans the way you choose: buy, sell or neutral.

