detection.resetLabel.shared=shared detection
detection.combining=Combining the two methods
detection.combining.help=A buy pattern is eligible when either model identifies a downtrend; a sell/short pattern is eligible when either identifies an uptrend. A sideways or unavailable result does not veto the other model, but opposite directional results reject the trend.
detection.position=Position within the trend
detection.position.help=The last completed close before the pattern must still be meaningfully beyond the median close of the exact trend leg shown on the chart. The margin is volatility-adjusted rather than a hardcoded percentage.
