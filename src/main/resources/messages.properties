# --- Custom alerts: learning mode
js.learn.customAlerts.chartTab=Alerts you set on one stock's chart, on a drawn line or an indicator. Alerts on an indicator or a horizontal line can grow into a custom alert with more conditions.
js.learn.customAlerts.interval=Each check reads completed candles of this length. A daily alert is checked after every trading day, a weekly one after every week. Indicators can still read a longer timeframe, for example a weekly average in a daily alert.
js.learn.customAlerts.groups=Groups let you mix All and Any, for example “(RSI below 30 and a bullish pattern) or (insiders bought)”. Each group says whether all or any of its conditions must be true, and the groups are joined the same way.
js.learn.customAlerts.quiet=After a trigger, the alert stays silent for this many candles on the same stock, even if the rule becomes true again. 0 means no quiet period.
js.learn.customAlerts.outcome=After each trigger StockWatch measures how far the close moved over this many candles. It shows whether your rule tends to come before rises or falls. It is not a trade result.
js.learn.customAlerts.notifyExisting=Normally an alert only triggers on candles that complete after you save it. Tick this to also hear about stocks that already match today; they are marked “Matched at save”.
js.learn.customAlerts.preview=The preview evaluates your rule with the same code as the live alert, on stored candles of the stock you choose: right now, and replayed over about two years. Nothing is saved.
js.learn.customAlerts.testOn=Any stock with stored history. It only changes the preview; the alert watches the stocks you choose in step 4.
js.learn.customAlerts.why=Every condition of the rule as it was, with the value that met it or the reason it did not. In an “any” group one met condition is enough.
js.learn.customAlerts.active=A paused alert checks nothing and keeps its triggers. When you switch it back on, it starts again from the next candle, so candles it missed cannot trigger it.
js.learn.customAlerts.matching=Stocks whose latest checked candle meets the whole rule. Click the number to see every stock with its state.
js.learn.customAlerts.checking=Stocks the alert has just started watching. Their first check runs within a minute from stored candles; stocks with no history wait for their next scheduled check.
js.learn.customAlerts.triggers=How many times the alert has fired, across all its stocks. Deleted triggers are not counted.
js.learn.customAlerts.state.MATCHING=The latest checked candle meets the rule.
js.learn.customAlerts.state.NOT_MATCHING=The latest checked candle does not meet the rule.
js.learn.customAlerts.state.CHECKING=Waiting for the first check, usually less than a minute.
js.learn.customAlerts.state.WAITING=Not enough completed candles are stored yet; the next scheduled check loads them.
js.learn.customAlerts.state.SKIPPED=A condition cannot apply to this instrument, for example insider trades for an ETF, so the alert ignores it.
js.learn.customAlerts.state.STOPPED=You stopped the alert for this stock. Resume it to watch the stock again.
js.learn.customAlerts.convert=Opens the builder with this chart alert as the first condition, so you can add more and apply it to other stocks. The chart alert is switched off when you save.
js.learn.customAlerts.negate=Turns the condition around: true when it is not met. Use it for “no insider sales in the last 30 days”.
js.learn.customAlerts.operator=“Is above” holds on every candle above the level. “Crosses above” holds only on the candle that moves from below to above, so it marks the moment of change.
js.learn.customAlerts.window=On the latest candle: only the newest completed candle counts. At least once in the last N: any of them. On each of the last N: every one of them, for a condition that has held for a while.
js.learn.customAlerts.timeframe=A longer timeframe reads weekly or monthly candles inside a daily alert. Its value only changes once that longer candle has closed, so there is no look-ahead.
js.learn.customAlerts.direction=Bullish patterns point to a rise, bearish ones to a fall. For Elliott waves this is the direction of the wave count.
js.learn.customAlerts.detected=A pattern counts from the candle on which it became recognisable. An Elliott wave end, for example, is only known a few candles after the turn; the trigger shows both dates.
js.learn.customAlerts.minScore=Only patterns with at least this setup score out of 100, using your own scoring settings. Leave it empty to accept any.
js.learn.customAlerts.outlook=The automated technical outlook combines many indicators into one buy, neutral or sell reading. It is read on the latest candle only.
js.learn.customAlerts.filingDate=Counted by the day the filing became public (SEC Form 4), not the day of the trade, so you only hear about what was knowable.
js.learn.customAlerts.disclosureDate=Counted by the day the trade was disclosed. Members of Congress may disclose up to 45 days after trading.
js.learn.customAlerts.minPeople=Several different people trading the same way (a “cluster”) is often read as a stronger sign than one trade.
js.learn.customAlerts.history=When the rule would have triggered over the stored history of the test stock, with the same trigger mode and quiet period. A tick is green when the price was higher after your follow-up window, red when lower.
js.learn.customAlerts.capacity=Each account can monitor a limited number of instruments across technical follows, outlooks and custom alerts. Stocks you already monitor cost nothing extra.

