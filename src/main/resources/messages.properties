# Candlestick patterns (pattern.* names are used across the app)
pattern.DOJI=Doji
candlestick.DOJI.formation=One-candle indecision
candlestick.DOJI.description=Open and close are nearly equal.
candlestick.DOJI.fixedRules=The candle must have a non-zero high-to-low range.
pattern.HAMMER=Hammer
candlestick.HAMMER.formation=One-candle bullish rejection
candlestick.HAMMER.description=A small body near the high with a long lower shadow after weakness.
candlestick.HAMMER.fixedRules=Body color is unrestricted; the lower shadow is the defining wick.
pattern.INVERTED_HAMMER=Inverted Hammer
candlestick.INVERTED_HAMMER.formation=One-candle bullish rejection
candlestick.INVERTED_HAMMER.description=A small body near the low with a long upper shadow after weakness.
candlestick.INVERTED_HAMMER.fixedRules=Body color is unrestricted; the upper shadow is the defining wick.
pattern.HANGING_MAN=Hanging Man
candlestick.HANGING_MAN.formation=One-candle bearish warning
candlestick.HANGING_MAN.description=A small body near the high with a long lower shadow after strength.
candlestick.HANGING_MAN.fixedRules=Body color is unrestricted; the lower shadow is the defining wick.
pattern.SHOOTING_STAR=Shooting Star
candlestick.SHOOTING_STAR.formation=One-candle bearish rejection
candlestick.SHOOTING_STAR.description=A small body near the low with a long upper shadow after strength.
candlestick.SHOOTING_STAR.fixedRules=Body color is unrestricted; the upper shadow is the defining wick.
pattern.BULLISH_ENGULFING=Bullish Engulfing
candlestick.BULLISH_ENGULFING.formation=Two-candle bullish reversal
candlestick.BULLISH_ENGULFING.description=A bullish second real body fully contains the prior bearish real body.
candlestick.BULLISH_ENGULFING.fixedRules=The first candle must close below its open, the second above its open, and the second body must contain both first-body edges and be strictly larger.
pattern.BEARISH_ENGULFING=Bearish Engulfing
candlestick.BEARISH_ENGULFING.formation=Two-candle bearish reversal
candlestick.BEARISH_ENGULFING.description=A bearish second real body fully contains the prior bullish real body.
candlestick.BEARISH_ENGULFING.fixedRules=The first candle must close above its open, the second below its open, and the second body must contain both first-body edges and be strictly larger.
pattern.PIERCING_LINE=Piercing Line
candlestick.PIERCING_LINE.formation=Two-candle bullish reversal
candlestick.PIERCING_LINE.description=A bullish candle opens below a long bearish candle and closes deeply inside its body.
candlestick.PIERCING_LINE.fixedRules=The first candle must be bearish; the second must be bullish and open below the first low and close past the body midpoint, but below the first open.
pattern.DARK_CLOUD_COVER=Dark Cloud Cover
candlestick.DARK_CLOUD_COVER.formation=Two-candle bearish reversal
candlestick.DARK_CLOUD_COVER.description=A bearish candle opens above a long bullish candle and closes deeply inside its body.
candlestick.DARK_CLOUD_COVER.fixedRules=The first candle must be bullish; the second must be bearish and open above the first high and close past the body midpoint, but above the first open.
pattern.BULLISH_HARAMI=Bullish Harami
candlestick.BULLISH_HARAMI.formation=Two-candle bullish reversal
candlestick.BULLISH_HARAMI.description=A small body sits completely inside a long real body after a decline.
candlestick.BULLISH_HARAMI.fixedRules=The first candle must be bearish; the inside candle may be either color. Both second-body edges must stay inside the first body. A qualifying doji is classified as Harami Cross.
pattern.BEARISH_HARAMI=Bearish Harami
candlestick.BEARISH_HARAMI.formation=Two-candle bearish reversal
candlestick.BEARISH_HARAMI.description=A small body sits completely inside a long real body after a rise.
candlestick.BEARISH_HARAMI.fixedRules=The first candle must be bullish; the inside candle may be either color. Both second-body edges must stay inside the first body. A qualifying doji is classified as Harami Cross.
pattern.BULLISH_HARAMI_CROSS=Bullish Harami Cross
candlestick.BULLISH_HARAMI_CROSS.formation=Two-candle bullish reversal
candlestick.BULLISH_HARAMI_CROSS.description=A doji body sits inside a long real body after a decline.
candlestick.BULLISH_HARAMI_CROSS.fixedRules=The first candle must be bearish; the doji body must lie strictly inside the first real body.
pattern.BEARISH_HARAMI_CROSS=Bearish Harami Cross
candlestick.BEARISH_HARAMI_CROSS.formation=Two-candle bearish reversal
candlestick.BEARISH_HARAMI_CROSS.description=A doji body sits inside a long real body after a rise.
candlestick.BEARISH_HARAMI_CROSS.fixedRules=The first candle must be bullish; the doji body must lie strictly inside the first real body.
pattern.MORNING_STAR=Morning Star
candlestick.MORNING_STAR.formation=Three-candle bullish reversal
candlestick.MORNING_STAR.description=A long bearish candle, a small star, then a strong bullish close into the first body.
candlestick.MORNING_STAR.fixedRules=The first candle must be bearish and the final candle bullish; the middle real body must gap entirely below the first real body.
pattern.EVENING_STAR=Evening Star
candlestick.EVENING_STAR.formation=Three-candle bearish reversal
candlestick.EVENING_STAR.description=A long bullish candle, a small star, then a strong bearish close into the first body.
candlestick.EVENING_STAR.fixedRules=The first candle must be bullish and the final candle bearish; the middle real body must gap entirely above the first real body.
pattern.THREE_WHITE_SOLDIERS=Three White Soldiers
candlestick.THREE_WHITE_SOLDIERS.formation=Three-candle bullish sequence
candlestick.THREE_WHITE_SOLDIERS.description=Three strong bullish candles with rising closes and compact upper shadows.
candlestick.THREE_WHITE_SOLDIERS.fixedRules=All three candles must be bullish; closes must rise and each later open must remain inside the preceding real body.
pattern.THREE_BLACK_CROWS=Three Black Crows
candlestick.THREE_BLACK_CROWS.formation=Three-candle bearish sequence
candlestick.THREE_BLACK_CROWS.description=Three strong bearish candles with falling closes and compact lower shadows.
candlestick.THREE_BLACK_CROWS.fixedRules=All three candles must be bearish; closes must fall and each later open must remain inside the preceding real body.

# Candlestick pattern measurements
candlestick.setting.doji.maxBodyPercent.label=Maximum real-body size
candlestick.setting.doji.maxBodyPercent.description=The open-to-close distance as a percentage of the candle's full high-to-low range.
candlestick.setting.doji.maxBodyPercent.effect=Lower this to accept only thinner, more indecisive bodies.
candlestick.setting.wick.minBodyPercent.label=Smallest permitted real body
candlestick.setting.wick.minBodyPercent.description=The distance from open to close, divided by the candle's full high-to-low range.
candlestick.setting.wick.minBodyPercent.effect=Raise this to reject extremely thin, doji-like bodies.
candlestick.setting.wick.minLongShadowBodyMultiple.label=Minimum long-shadow length
candlestick.setting.wick.minLongShadowBodyMultiple.description=The defining long shadow must be at least this many times the real-body height.
candlestick.setting.wick.minLongShadowBodyMultiple.effect=Raise this to demand a more pronounced rejection wick.
candlestick.setting.wick.maxShortShadowBodyMultiple.label=Maximum opposite-shadow length
candlestick.setting.wick.maxShortShadowBodyMultiple.description=The short shadow on the opposite side may be no more than this many times the real-body height.
candlestick.setting.wick.maxShortShadowBodyMultiple.effect=Lower this to require a cleaner candle with less wick on the opposite side.
candlestick.setting.wick.maxBodyPercent.label=Largest permitted real body
candlestick.setting.wick.maxBodyPercent.description=The distance from open to close, divided by the candle's full high-to-low range.
candlestick.setting.wick.maxBodyPercent.effect=Lower this to require a smaller body relative to the candle's complete range.
candlestick.setting.engulfing.previousMinBodyPercent.label=Minimum first-candle body
candlestick.setting.engulfing.previousMinBodyPercent.description=The first candle's open-to-close body as a percentage of its full high-to-low range.
candlestick.setting.engulfing.previousMinBodyPercent.effect=Raise this to require a more decisive first candle.
candlestick.setting.engulfing.currentMinPreviousBodyMultiple.label=Minimum second body versus first body
candlestick.setting.engulfing.currentMinPreviousBodyMultiple.description=The second candle's real body must be at least this many times the first candle's real body.
candlestick.setting.engulfing.currentMinPreviousBodyMultiple.effect=Raise this to require the engulfing candle to overpower the first candle by a larger margin.
candlestick.setting.engulfing.currentMinBodyPercent.label=Minimum second-candle body
candlestick.setting.engulfing.currentMinBodyPercent.description=The engulfing candle's open-to-close body as a percentage of its own full high-to-low range.
candlestick.setting.engulfing.currentMinBodyPercent.effect=Raise this to require a stronger directional engulfing candle.
candlestick.setting.reversalPair.previousMinBodyPercent.label=Minimum first-candle body
candlestick.setting.reversalPair.previousMinBodyPercent.description=The first candle's real body as a percentage of its full range.
candlestick.setting.reversalPair.previousMinBodyPercent.effect=Raise this to require a stronger first candle.
candlestick.setting.reversalPair.previousMinMedianMultiple.label=First body versus recent median
candlestick.setting.reversalPair.previousMinMedianMultiple.description=The first body must be at least this many times the median real-body size in the preceding candles.
candlestick.setting.reversalPair.previousMinMedianMultiple.effect=Raise this to make 'long first candle' more selective.
candlestick.setting.reversalPair.currentMinBodyPercent.label=Minimum reversal-candle body
candlestick.setting.reversalPair.currentMinBodyPercent.description=The second candle's real body as a percentage of its own full range.
candlestick.setting.reversalPair.currentMinBodyPercent.effect=Raise this to require a more forceful reversal candle.
candlestick.setting.reversalPair.currentMinMedianMultiple.label=Reversal body versus recent median
candlestick.setting.reversalPair.currentMinMedianMultiple.description=The second body must be at least this many times the recent median real-body size.
candlestick.setting.reversalPair.currentMinMedianMultiple.effect=Raise this to demand a larger reversal body.
candlestick.setting.reversalPair.penetrationPercent.label=Minimum close into the first body
candlestick.setting.reversalPair.penetrationPercent.description=How far the second close must travel through the first candle's real body, measured from the reversal side.
candlestick.setting.reversalPair.penetrationPercent.effect=Raise this to require deeper reversal confirmation.
candlestick.setting.harami.firstMinBodyPercent.label=Minimum outside-candle body
candlestick.setting.harami.firstMinBodyPercent.description=The first candle's real body as a percentage of its full range.
candlestick.setting.harami.firstMinBodyPercent.effect=Raise this to require a stronger outside candle.
candlestick.setting.harami.firstMinMedianMultiple.label=Outside body versus recent median
candlestick.setting.harami.firstMinMedianMultiple.description=The first body must be at least this many times the median body of preceding candles.
candlestick.setting.harami.firstMinMedianMultiple.effect=Raise this to make the required outside candle more exceptional.
candlestick.setting.harami.secondMaxFirstBodyPercent.label=Maximum inside body versus outside body
candlestick.setting.harami.secondMaxFirstBodyPercent.description=The inside candle's body may be no more than this percentage of the first candle's body.
candlestick.setting.harami.secondMaxFirstBodyPercent.effect=Lower this to demand a more compact inside candle.
candlestick.setting.harami.secondMaxMedianMultiple.label=Maximum inside body versus recent median
candlestick.setting.harami.secondMaxMedianMultiple.description=The inside body may be no more than this many times the recent median body.
candlestick.setting.harami.secondMaxMedianMultiple.effect=Lower this to make the inside candle smaller relative to recent trading.
candlestick.setting.haramiCross.maxBodyPercent.label=Maximum doji body
candlestick.setting.haramiCross.maxBodyPercent.description=The inside candle's body as a percentage of its full range.
candlestick.setting.haramiCross.maxBodyPercent.effect=Lower this to require a thinner doji.
candlestick.setting.star.firstMinBodyPercent.label=Minimum first-candle body
candlestick.setting.star.firstMinBodyPercent.description=The first candle's body as a percentage of its complete high-to-low range.
candlestick.setting.star.firstMinBodyPercent.effect=Raise this to require a more decisive opening candle.
candlestick.setting.star.firstMinMedianMultiple.label=First body versus recent median
candlestick.setting.star.firstMinMedianMultiple.description=The first body must be at least this many times the median body in preceding candles.
candlestick.setting.star.firstMinMedianMultiple.effect=Raise this to make the first candle more exceptional.
candlestick.setting.star.middleMaxBodyPercent.label=Maximum star-candle body
candlestick.setting.star.middleMaxBodyPercent.description=The middle candle's body as a percentage of its own full range.
candlestick.setting.star.middleMaxBodyPercent.effect=Lower this to require a smaller, more indecisive middle candle.
candlestick.setting.star.middleMaxMedianMultiple.label=Star body versus recent median
candlestick.setting.star.middleMaxMedianMultiple.description=The middle body may be no more than this many times the preceding median body.
candlestick.setting.star.middleMaxMedianMultiple.effect=Lower this to require stronger contraction in the middle candle.
candlestick.setting.star.currentMinBodyPercent.label=Minimum confirmation-candle body
candlestick.setting.star.currentMinBodyPercent.description=The final candle's body as a percentage of its own full range.
candlestick.setting.star.currentMinBodyPercent.effect=Raise this to require stronger reversal confirmation.
candlestick.setting.star.currentMinMedianMultiple.label=Confirmation body versus recent median
candlestick.setting.star.currentMinMedianMultiple.description=The final body must be at least this many times the preceding median body.
candlestick.setting.star.currentMinMedianMultiple.effect=Raise this to demand a larger confirmation candle.
candlestick.setting.star.penetrationPercent.label=Minimum close into the first body
candlestick.setting.star.penetrationPercent.description=How far the final close must travel through the first candle's real body.
candlestick.setting.star.penetrationPercent.effect=Raise this to require deeper confirmation into the first candle.
candlestick.setting.threeCandleRun.candleMinBodyPercent.label=Minimum body for each of the three candles
candlestick.setting.threeCandleRun.candleMinBodyPercent.description=Every candle's real body as a percentage of that candle's full high-to-low range.
candlestick.setting.threeCandleRun.candleMinBodyPercent.effect=Raise this to require all three candles to close more decisively.
candlestick.setting.threeCandleRun.candleMinMedianMultiple.label=Each body versus recent median
candlestick.setting.threeCandleRun.candleMinMedianMultiple.description=Every body must be at least this many times the median body in preceding candles.
candlestick.setting.threeCandleRun.candleMinMedianMultiple.effect=Raise this to require consistently larger candles.
candlestick.setting.threeCandleRun.maxDirectionalShadowBodyMultiple.label=Maximum wick beyond each close
candlestick.setting.threeCandleRun.maxDirectionalShadowBodyMultiple.description=The wick past each candle's close, in the direction of the run, may be no more than this many times its body.
candlestick.setting.threeCandleRun.maxDirectionalShadowBodyMultiple.effect=Lower this to require closes nearer each candle's extreme.

