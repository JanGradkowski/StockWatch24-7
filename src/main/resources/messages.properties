# Elliott Wave rules
elliott.setting.minimumCandles.label=Minimum completed candles
elliott.setting.minimumCandles.description=How much completed history must exist before Elliott detection runs.
elliott.setting.minimumCandles.effect=Raise this to require more context before any structure is considered.
elliott.setting.minimumStructureQuality.label=Minimum structure quality
elliott.setting.minimumStructureQuality.description=The lowest internal structural-quality score allowed onto charts and historical reconstruction.
elliott.setting.minimumStructureQuality.effect=Raise this to hide weaker but structurally valid counts.
elliott.setting.minimumSignalConfidence.label=Minimum alert confidence
elliott.setting.minimumSignalConfidence.description=The minimum confidence required before a detected Elliott turning point can produce an alert.
elliott.setting.minimumSignalConfidence.effect=Raise this to reduce alerts without removing lower-quality chart overlays.
elliott.setting.maximumConfirmationLagCandles.label=Maximum confirmation delay
elliott.setting.maximumConfirmationLagCandles.description=How many completed candles may pass after Wave V or C ends before its reversal confirmation becomes too late.
elliott.setting.maximumConfirmationLagCandles.effect=Lower this to require a faster reversal after the endpoint.
elliott.setting.minimumImpulseSpanCandles.label=Minimum complete I–V duration
elliott.setting.minimumImpulseSpanCandles.description=The minimum number of interval candles from the impulse origin through Wave V.
elliott.setting.minimumImpulseSpanCandles.effect=Raise this to reject compressed five-wave counts.
elliott.setting.minimumLegSpanCandles.label=Minimum candles in each wave leg
elliott.setting.minimumLegSpanCandles.description=The minimum number of interval candles between two consecutive Elliott pivots.
elliott.setting.minimumLegSpanCandles.effect=Raise this to prevent very short price swings from becoming separate waves.
elliott.setting.breakoutBufferPercent.label=Wave V breakout buffer
elliott.setting.breakoutBufferPercent.description=How far price must close beyond Wave III before a developing Wave V breakout is confirmed.
elliott.setting.breakoutBufferPercent.effect=Raise this to require a more decisive break beyond Wave III.
elliott.setting.reversalFloorPercent.label=Minimum pivot reversal floor
elliott.setting.reversalFloorPercent.description=The percentage of price used as the minimum reversal distance when ATR is smaller.
elliott.setting.reversalFloorPercent.effect=Raise this to create fewer, larger swing pivots.
elliott.setting.pivotSensitivity1.label=Pivot sensitivity — finest
elliott.setting.pivotSensitivity1.description=ATR and reversal-floor multiplier for the most detailed pivot count.
elliott.setting.pivotSensitivity1.effect=Raise this to ignore more small price swings.
elliott.setting.pivotSensitivity2.label=Pivot sensitivity — detailed
elliott.setting.pivotSensitivity2.description=ATR and reversal-floor multiplier for the second pivot count.
elliott.setting.pivotSensitivity2.effect=Raise this to require larger reversals at this degree.
elliott.setting.pivotSensitivity3.label=Pivot sensitivity — broad
elliott.setting.pivotSensitivity3.description=ATR and reversal-floor multiplier for the third pivot count.
elliott.setting.pivotSensitivity3.effect=Raise this to retain only broader reversals.
elliott.setting.pivotSensitivity4.label=Pivot sensitivity — broadest
elliott.setting.pivotSensitivity4.description=ATR and reversal-floor multiplier for the least detailed pivot count.
elliott.setting.pivotSensitivity4.effect=Raise this to retain only the largest reversals.
elliott.setting.maximumStructureOverlapPercent.label=Maximum overlap between displayed counts
elliott.setting.maximumStructureOverlapPercent.description=The share of the shorter structure that may overlap an already selected Elliott structure.
elliott.setting.maximumStructureOverlapPercent.effect=Lower this to show fewer competing structures over the same history.
elliott.setting.waveTwoMaximumPercent.label=Absolute maximum Wave II retracement
elliott.setting.waveTwoMaximumPercent.description=Wave II depth measured against Wave I. At 100%, Wave II may approach but may not erase the Wave I origin.
elliott.setting.waveTwoMaximumPercent.effect=Lower this to reject deeper Wave II candidates.
elliott.setting.waveTwoPreferredMinPercent.label=Preferred Wave II — minimum
elliott.setting.waveTwoPreferredMinPercent.description=Lower edge of the wider Wave II range that receives normal structural treatment.
elliott.setting.waveTwoPreferredMinPercent.effect=Raise this to treat shallow Wave II retracements as lower quality.
elliott.setting.waveTwoPreferredMaxPercent.label=Preferred Wave II — maximum
elliott.setting.waveTwoPreferredMaxPercent.description=Upper edge of the wider Wave II range that receives normal structural treatment.
elliott.setting.waveTwoPreferredMaxPercent.effect=Lower this to treat deep Wave II retracements as lower quality.
elliott.setting.waveTwoCommonMinPercent.label=Common Fibonacci Wave II — minimum
elliott.setting.waveTwoCommonMinPercent.description=Lower edge of the narrower Wave II zone that receives an additional quality bonus.
elliott.setting.waveTwoCommonMinPercent.effect=Raise this to narrow the common Fibonacci zone from below.
elliott.setting.waveTwoCommonMaxPercent.label=Common Fibonacci Wave II — maximum
elliott.setting.waveTwoCommonMaxPercent.description=Upper edge of the narrower Wave II zone that receives an additional quality bonus.
elliott.setting.waveTwoCommonMaxPercent.effect=Lower this to narrow the common Fibonacci zone from above.
elliott.setting.waveThreePreliminaryMinimumPercent.label=Developing Wave III versus Wave I
elliott.setting.waveThreePreliminaryMinimumPercent.description=Before Wave V is complete, Wave III length divided by Wave I length. Shorter values reduce confidence.
elliott.setting.waveThreePreliminaryMinimumPercent.effect=Raise this to penalize a comparatively short developing Wave III sooner.
elliott.setting.waveFourMaximumPercent.label=Absolute maximum Wave IV retracement
elliott.setting.waveFourMaximumPercent.description=Wave IV depth measured against Wave III.
elliott.setting.waveFourMaximumPercent.effect=Lower this to reject deeper Wave IV candidates.
elliott.setting.waveFourPreferredMinPercent.label=Preferred Wave IV — minimum
elliott.setting.waveFourPreferredMinPercent.description=Lower edge of the wider Wave IV range that receives normal structural treatment.
elliott.setting.waveFourPreferredMinPercent.effect=Raise this to treat very shallow Wave IV retracements as lower quality.
elliott.setting.waveFourPreferredMaxPercent.label=Preferred Wave IV — maximum
elliott.setting.waveFourPreferredMaxPercent.description=Upper edge of the wider Wave IV range that receives normal structural treatment.
elliott.setting.waveFourPreferredMaxPercent.effect=Lower this to treat deep Wave IV retracements as lower quality.
elliott.setting.waveFourCommonMinPercent.label=Common Fibonacci Wave IV — minimum
elliott.setting.waveFourCommonMinPercent.description=Lower edge of the narrower Wave IV bonus zone.
elliott.setting.waveFourCommonMinPercent.effect=Raise this to narrow the common Fibonacci zone from below.
elliott.setting.waveFourCommonMaxPercent.label=Common Fibonacci Wave IV — maximum
elliott.setting.waveFourCommonMaxPercent.description=Upper edge of the narrower Wave IV bonus zone.
elliott.setting.waveFourCommonMaxPercent.effect=Lower this to narrow the common Fibonacci zone from above.
elliott.setting.correctionMaximumPercent.label=Absolute maximum A–B–C retracement
elliott.setting.correctionMaximumPercent.description=The distance from Wave V to Wave C divided by the complete impulse move from origin to Wave V.
elliott.setting.correctionMaximumPercent.effect=Lower this to reject corrections that retrace more of the preceding impulse.
elliott.setting.waveBMaximumRecoveryPercent.label=Maximum Wave B recovery
elliott.setting.waveBMaximumRecoveryPercent.description=Wave B length from A divided by Wave A length. Values above 100% allow B to pass the Wave V endpoint.
elliott.setting.waveBMaximumRecoveryPercent.effect=Lower this to reject more expanded and running-flat candidates.
elliott.setting.correctionPreferredMinPercent.label=Preferred full correction — minimum
elliott.setting.correctionPreferredMinPercent.description=Lower edge of the wider origin-to-V retracement range for the completed A–B–C.
elliott.setting.correctionPreferredMinPercent.effect=Raise this to reduce the quality of shallow corrections.
elliott.setting.correctionPreferredMaxPercent.label=Preferred full correction — maximum
elliott.setting.correctionPreferredMaxPercent.description=Upper edge of the wider origin-to-V retracement range for the completed A–B–C.
elliott.setting.correctionPreferredMaxPercent.effect=Lower this to reduce the quality of deep corrections.
elliott.setting.correctionCommonMinPercent.label=Common correction zone — minimum
elliott.setting.correctionCommonMinPercent.description=Lower edge of the narrower completed-correction bonus zone.
elliott.setting.correctionCommonMinPercent.effect=Raise this to narrow the common correction zone from below.
elliott.setting.correctionCommonMaxPercent.label=Common correction zone — maximum
elliott.setting.correctionCommonMaxPercent.description=Upper edge of the narrower completed-correction bonus zone.
elliott.setting.correctionCommonMaxPercent.effect=Lower this to narrow the common correction zone from above.
elliott.setting.waveCPreferredMinPercent.label=Preferred Wave C versus Wave A — minimum
elliott.setting.waveCPreferredMinPercent.description=Wave C length divided by Wave A length; 50% means C is half the length of A.
elliott.setting.waveCPreferredMinPercent.effect=Raise this to reduce the quality of short Wave C candidates.
elliott.setting.waveCPreferredMaxPercent.label=Preferred Wave C versus Wave A — maximum
elliott.setting.waveCPreferredMaxPercent.description=Upper edge of the wider proportionate Wave C range.
elliott.setting.waveCPreferredMaxPercent.effect=Lower this to reduce the quality of extended Wave C candidates.
elliott.setting.waveCCommonMinPercent.label=Near-equality C:A — minimum
elliott.setting.waveCCommonMinPercent.description=Lower edge of the narrower range where Wave C is considered near equality with Wave A.
elliott.setting.waveCCommonMinPercent.effect=Raise this to demand closer equality from below.
elliott.setting.waveCCommonMaxPercent.label=Near-equality C:A — maximum
elliott.setting.waveCCommonMaxPercent.description=Upper edge of the narrower range where Wave C is considered near equality with Wave A.
elliott.setting.waveCCommonMaxPercent.effect=Lower this to demand closer equality from above.
elliott.setting.waveCAllowedMinPercent.label=Allowed C:A ratio — minimum
elliott.setting.waveCAllowedMinPercent.description=Hard lower Wave C length when the optional C:A limit switch is enabled.
elliott.setting.waveCAllowedMinPercent.effect=Raise this to reject corrections with a shorter Wave C.
elliott.setting.waveCAllowedMaxPercent.label=Allowed C:A ratio — maximum
elliott.setting.waveCAllowedMaxPercent.description=Hard upper Wave C length when the optional C:A limit switch is enabled.
elliott.setting.waveCAllowedMaxPercent.effect=Lower this to reject corrections with a more extended Wave C.
elliott.setting.requireWaveFourNoOverlap.label=Require Wave IV not to overlap Wave I
elliott.setting.requireWaveFourNoOverlap.description=When enabled, Wave IV must remain beyond the Wave I endpoint in the impulse direction.
elliott.setting.requireWaveFourNoOverlap.effect=This is the standard non-diagonal impulse rule.
elliott.setting.requireWaveThreeNotShortest.label=Require Wave III not to be the shortest
elliott.setting.requireWaveThreeNotShortest.description=Compares the price lengths of Waves I, III, and V after Wave V is available.
elliott.setting.requireWaveThreeNotShortest.effect=Enabled enforces the conventional Elliott hard rule.
elliott.setting.allowWaveOneLongest.label=Allow Wave I to be the longest actionary wave
elliott.setting.allowWaveOneLongest.description=If disabled, Wave I must not be longer than both Waves III and V. This option is ignored when the stricter shortest-Wave-I rule is enabled.
elliott.setting.allowWaveOneLongest.effect=Enabled reflects conventional Elliott theory: Wave I may be longest as long as Wave III is not shortest.
elliott.setting.requireWaveOneShortest.label=Require Wave I to be the shortest actionary wave
elliott.setting.requireWaveOneShortest.description=Once the Wave V endpoint is available, compares the absolute price lengths of Waves I, III, and V. Wave I must be no longer than both Wave III and Wave V; equal-length ties are accepted.
elliott.setting.requireWaveOneShortest.effect=Enabled rejects completed counts that violate this strict rule and overrides the permissive ‘Allow Wave I to be longest’ option. Expect substantially fewer detections.
elliott.setting.allowWaveFiveLongest.label=Allow Wave V to be the longest actionary wave
elliott.setting.allowWaveFiveLongest.description=If disabled, Wave V must not be longer than both Waves I and III.
elliott.setting.allowWaveFiveLongest.effect=Enabled permits extended fifth waves.
elliott.setting.allowTruncatedFifth.label=Allow truncated Wave V
elliott.setting.allowTruncatedFifth.description=A truncated bullish V may end at or below Wave III; a bearish V may end at or above Wave III.
elliott.setting.allowTruncatedFifth.effect=Disable this to require Wave V to exceed the Wave III extreme.
elliott.setting.requireWaveAWithinOrigin.label=Require Wave A to stay inside the impulse origin
elliott.setting.requireWaveAWithinOrigin.description=Wave A may retrace the impulse but may not cross the point where Wave I began.
elliott.setting.requireWaveAWithinOrigin.effect=Enabled prevents the first corrective leg from invalidating the entire preceding impulse.
elliott.setting.allowStandardCorrection.label=Allow standard A–B–C corrections
elliott.setting.allowStandardCorrection.description=Wave B stays inside the Wave V endpoint.
elliott.setting.allowStandardCorrection.effect=Disable this to accept only enabled flat variants.
elliott.setting.allowExpandedFlat.label=Allow expanded flats
elliott.setting.allowExpandedFlat.description=Wave B passes Wave V and Wave C passes the Wave A extreme.
elliott.setting.allowExpandedFlat.effect=Disable this to reject expanded-flat geometry.
elliott.setting.allowRunningFlat.label=Allow running flats
elliott.setting.allowRunningFlat.description=Wave B passes Wave V but Wave C does not pass the Wave A extreme.
elliott.setting.allowRunningFlat.effect=Disable this to reject running-flat geometry.
elliott.setting.allowTriangles.label=Allow A–B–C–D–E triangle subwaves
elliott.setting.allowTriangles.description=Permits contracting triangle counts inside Wave IV, B, or equivalent corrective parent waves.
elliott.setting.allowTriangles.effect=Disable this to show only three-leg corrective subdivisions.
elliott.setting.limitWaveCToARatio.label=Enforce the allowed Wave C versus Wave A range
elliott.setting.limitWaveCToARatio.description=Turns the allowed C:A minimum and maximum into hard rejection rules instead of quality guidance.
elliott.setting.limitWaveCToARatio.effect=Enable this when you want disproportionate C legs rejected completely.

