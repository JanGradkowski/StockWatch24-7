# Settings: detection
detection.heading=Candlestick trend detection
detection.intro=Trend detection combines price structure with a minimum move and candle count. Either method can qualify a trend, but opposite results reject it.
detection.excluded=The pattern candle or candles are excluded from the prior-trend window.
detection.symmetric=The original move/count rule applies symmetrically to both uptrends and downtrends.
detection.rules=Detection rules
detection.rules.note=Price structure, minimum move and directional candles.
detection.resetLabel.shared=shared detection
detection.combining=Combining the two methods
detection.combining.help=A buy pattern is eligible when either model identifies a downtrend; a sell/short pattern is eligible when either identifies an uptrend. A sideways or unavailable result does not veto the other model, but opposite directional results reject the trend.
detection.position=Position within the trend
