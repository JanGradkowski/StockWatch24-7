spring.config.import=optional:file:.env[.properties]

# 1. Update the connection URL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/uptodate_db}
spring.datasource.username=${DB_USERNAME:uptodate}
spring.datasource.password=${DB_PASSWORD}

# 2. Change the Driver and Dialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 3. Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.user=${DB_MIGRATION_USERNAME:${DB_USERNAME:uptodate}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}

twelve-data.api-key=${TWELVE_DATA_API_KEY:}
twelve-data.base-url=${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
twelve-data.quote-cache-ttl-seconds=60

yahoo-finance.enabled=${YAHOO_FINANCE_ENABLED:true}
yahoo-finance.base-url=${YAHOO_FINANCE_BASE_URL:https://query1.finance.yahoo.com}

market-data.refresh-cooldown.intraday-seconds=${MARKET_DATA_INTRADAY_COOLDOWN_SECONDS:60}
market-data.refresh-cooldown.daily-seconds=${MARKET_DATA_DAILY_COOLDOWN_SECONDS:600}
market-data.refresh-cooldown.higher-interval-seconds=${MARKET_DATA_HIGHER_INTERVAL_COOLDOWN_SECONDS:3600}
market-data.sync-lease-seconds=${MARKET_DATA_SYNC_LEASE_SECONDS:900}
market-data.http.connect-timeout-seconds=${MARKET_DATA_CONNECT_TIMEOUT_SECONDS:10}
market-data.http.read-timeout-seconds=${MARKET_DATA_READ_TIMEOUT_SECONDS:30}

alerts.max-tracked-stocks-per-user=${ALERTS_MAX_TRACKED_STOCKS_PER_USER:50}
alerts.max-global-tracked-stocks=${ALERTS_MAX_GLOBAL_TRACKED_STOCKS:500}
alerts.schedule.enabled=${ALERT_SCHEDULE_ENABLED:true}
alerts.schedule.zone=Europe/Brussels
# Midnight Tuesday-Saturday checks the completed Monday-Friday market sessions.
alerts.schedule.daily-cron=0 0 0 * * TUE-SAT
alerts.schedule.weekly-cron=0 0 0 * * SAT
alerts.schedule.monthly-cron=0 0 0 1 * *
alerts.schedule.worker-delay-ms=60000
alerts.schedule.initial-delay-ms=30000
alerts.schedule.job-lease-seconds=${ALERT_JOB_LEASE_SECONDS:1200}
alerts.schedule.retry-delay-seconds=${ALERT_RETRY_DELAY_SECONDS:60}
alerts.schedule.maximum-attempts=${ALERT_MAXIMUM_ATTEMPTS:3}
alerts.schedule.recovery-delay-ms=${ALERT_RECOVERY_DELAY_MS:60000}
alerts.schedule.recovery-initial-delay-ms=${ALERT_RECOVERY_INITIAL_DELAY_MS:5000}
alerts.schedule.catch-up-batch-size=${ALERT_CATCH_UP_BATCH_SIZE:100}
alerts.schedule.initial-lookback-days=${ALERT_INITIAL_SCHEDULE_LOOKBACK_DAYS:370}
alerts.elliott.weekly-enabled=true
alerts.elliott.monthly-enabled=true
alerts.candlestick.lifecycle-window-candles=${ALERT_CANDLESTICK_LIFECYCLE_WINDOW_CANDLES:3}
alerts.email.enabled=${ALERTS_EMAIL_ENABLED:false}
alerts.email.from=${ALERTS_EMAIL_FROM:no-reply@stockwatch.local}
alerts.email.time-zone=${ALERTS_EMAIL_TIME_ZONE:${alerts.schedule.zone}}

# Congressional stock activity
# The free CongressInvests tier currently exposes a 365-day window and allows
# 100 calls/day. StockWatch stops at 90 calls/day across all running instances
# so browser history requests cannot accidentally exhaust the external quota.
congressional-activity.enabled=${CONGRESSIONAL_ACTIVITY_ENABLED:true}
congressional-activity.history-days=${CONGRESSIONAL_ACTIVITY_HISTORY_DAYS:365}
congressional-activity.history-cache-ttl-hours=${CONGRESSIONAL_ACTIVITY_CACHE_TTL_HOURS:24}
congressional-activity.history-cache-lease-seconds=${CONGRESSIONAL_ACTIVITY_CACHE_LEASE_SECONDS:120}
congressional-activity.maximum-uncached-refreshes-per-user-per-minute=${CONGRESSIONAL_ACTIVITY_MAX_UNCACHED_REFRESHES_PER_USER_PER_MINUTE:2}
congressional-activity.maximum-follows-per-user=${CONGRESSIONAL_ACTIVITY_MAX_FOLLOWS:50}
congressional-activity.attribution-url=https://congressinvests.com/
congressional-activity.congress-invests.base-url=${CONGRESS_INVESTS_BASE_URL:https://congressinfor-production.up.railway.app}
congressional-activity.congress-invests.page-size=${CONGRESS_INVESTS_PAGE_SIZE:500}
congressional-activity.congress-invests.maximum-history-pages=${CONGRESS_INVESTS_MAX_HISTORY_PAGES:3}
congressional-activity.congress-invests.recent-trade-limit=${CONGRESS_INVESTS_RECENT_LIMIT:500}
congressional-activity.congress-invests.daily-request-budget=${CONGRESS_INVESTS_DAILY_REQUEST_BUDGET:90}
# Leave blank on the free plan. A paid key is sent only in the X-Api-Key header.
congressional-activity.congress-invests.api-key=${CONGRESS_INVESTS_API_KEY:}
# The worker checks frequently, but the database lease permits only one
# provider poll every six hours across the whole deployment (about 4 calls/day).
congressional-activity.poll-check-delay-ms=${CONGRESSIONAL_ACTIVITY_POLL_CHECK_DELAY_MS:60000}
congressional-activity.poll-initial-delay-ms=${CONGRESSIONAL_ACTIVITY_POLL_INITIAL_DELAY_MS:30000}
congressional-activity.poll-interval-hours=${CONGRESSIONAL_ACTIVITY_POLL_INTERVAL_HOURS:6}
congressional-activity.poll-lease-seconds=${CONGRESSIONAL_ACTIVITY_POLL_LEASE_SECONDS:300}
congressional-activity.poll-failure-retry-minutes=${CONGRESSIONAL_ACTIVITY_POLL_RETRY_MINUTES:60}
congressional-activity.delivery-worker-delay-ms=${CONGRESSIONAL_ACTIVITY_DELIVERY_DELAY_MS:60000}
congressional-activity.delivery-worker-initial-delay-ms=${CONGRESSIONAL_ACTIVITY_DELIVERY_INITIAL_DELAY_MS:45000}
congressional-activity.delivery-lease-seconds=${CONGRESSIONAL_ACTIVITY_DELIVERY_LEASE_SECONDS:300}
congressional-activity.maximum-delivery-attempts=${CONGRESSIONAL_ACTIVITY_MAX_DELIVERY_ATTEMPTS:5}
congressional-activity.delivery-retry-delay-seconds=${CONGRESSIONAL_ACTIVITY_RETRY_DELAY_SECONDS:300}
congressional-activity.delivery-batch-size=${CONGRESSIONAL_ACTIVITY_DELIVERY_BATCH_SIZE:25}

# Set these in .env when ALERTS_EMAIL_ENABLED=true
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:10000}

server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
# Never place session identifiers in URLs, where they can leak through logs and referrers.
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=none
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=64KB
server.tomcat.max-swallow-size=64KB
server.tomcat.connection-timeout=${SERVER_CONNECTION_TIMEOUT:10s}
server.tomcat.keep-alive-timeout=${SERVER_KEEP_ALIVE_TIMEOUT:15s}
server.tomcat.max-keep-alive-requests=${SERVER_MAX_KEEP_ALIVE_REQUESTS:100}
spring.servlet.multipart.enabled=false

security.require-https=${REQUIRE_HTTPS:false}
security.https-redirect-port=${PUBLIC_HTTPS_PORT:443}
security.session.absolute-timeout-seconds=${SESSION_ABSOLUTE_TIMEOUT_SECONDS:43200}
security.request.max-json-body-bytes=${MAX_JSON_BODY_BYTES:65536}
security.email-verification.required=${EMAIL_VERIFICATION_REQUIRED:true}
security.email-verification.ttl-hours=${EMAIL_VERIFICATION_TTL_HOURS:24}
security.email-verification.resend-cooldown-minutes=${EMAIL_VERIFICATION_RESEND_COOLDOWN_MINUTES:15}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
