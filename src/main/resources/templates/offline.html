<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="#{pwa.offline.title}">You are offline — StockWatch 24/7</title>
<!--/* Served from the service worker's cache when the network is gone, so it carries its own small style: the site's
       stylesheets are not cached. The nonce is the one in this response's own CSP header. */-->
<style th:attr="nonce=${cspNonce}">
  :root { color-scheme: dark light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
         background: #0a0d12; color: #e8ecf3; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 420px; display: grid; gap: 14px; justify-items: start; }
  h1 { margin: 0; font-size: 1.5rem; }
  p { margin: 0; color: #b7c0ce; }
  a { display: inline-block; padding: 10px 16px; border-radius: 9px; background: #7b8cff; color: #0a0d12;
      font-weight: 700; text-decoration: none; }
  @media (prefers-color-scheme: light) { body { background: #f8f9fb; color: #10141b; } p { color: #5b6474; }
    a { background: #3b4ce0; color: #fff; } }
</style>
</head>
<body>
<main>
  <img th:src="@{/icons/icon.svg}" src="/icons/icon.svg" width="56" height="56" alt="">
  <h1 th:text="#{pwa.offline.heading}">You are offline</h1>
  <p th:text="#{pwa.offline.text}">StockWatch needs a connection to show your alerts and charts. Nothing is stored on this device.</p>
  <a th:href="@{/home}" th:text="#{pwa.offline.retry}">Try again</a>
</main>
</body>
</html>
