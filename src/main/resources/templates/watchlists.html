<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" th:attr="data-account-theme=${accountTheme},data-learning-mode=${learningMode == true ? 'on' : null}">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${watchlistName != null ? watchlistName + ' — StockWatch 24/7' : #messages.msg('watchlists.pageTitle')}">Watchlists — StockWatch 24/7</title>
  <script th:src="@{/i18n/messages.js(lang=${#locale.language},v=${T(org.example.stockwatch247.i18n.I18nScriptController).VERSION})}"></script><script th:src="@{/js/theme.js}"></script>
  <link rel="stylesheet" th:href="@{/css/tokens.css}"><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/design.css}">
  <link rel="stylesheet" th:href="@{/css/refresh.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script th:src="@{/js/design-ui.js}" defer></script>
</head>
<body class="ui-refresh">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="dashboard-container">
  <header class="app-hero"><div class="app-hero-copy"><div class="eyebrow" th:text="#{watchlists.eyebrow}">Your workspace</div>
    <a th:if="${selectedWatchlistId != null}" th:href="@{/watchlists}" class="text-link" th:text="#{watchlists.all}">All watchlists</a>
    <h1 th:text="${watchlistName != null ? watchlistName : #messages.msg('watchlists.heading')}">Watchlists</h1><p class="welcome-subtitle" th:text="${selectedWatchlistId != null ? #messages.msg('watchlists.subtitle.single') : #messages.msg('watchlists.subtitle.all')}">Organize instruments your way.</p>
  </div></header>
  <section class="glass-panel dashboard-panel" aria-label="Manage watchlists" th:aria-label="#{watchlists.manageAria}">
    <div class="panel-heading"><h2 class="panel-title" th:text="${selectedWatchlistId != null ? #messages.msg('watchlists.overview') : #messages.msg('watchlists.yours')}">Your watchlists</h2><div class="wl-actions"><button type="button" class="btn-secondary" data-watchlist-imports th:text="#{watchlists.recentImports}">Recent imports</button><button type="button" class="btn-accent" data-create-watchlist th:text="#{watchlists.create}">Create watchlist</button></div></div>
    <label th:if="${selectedWatchlistId == null}" class="wl-field"><span th:text="#{watchlists.find}">Find a watchlist</span><input type="search" data-watchlist-search placeholder="Search by name or description" th:placeholder="#{watchlists.searchPlaceholder}"></label>
    <div data-named-watchlists data-management="true" th:attr="data-selected-id=${selectedWatchlistId}"><p role="status" th:text="#{watchlists.loading}">Loading watchlists…</p></div>
  </section>
</main>
</body></html>
