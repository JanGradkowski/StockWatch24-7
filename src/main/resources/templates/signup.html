<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Sign Up - StockWatch 24/7</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style th:attr="nonce=${cspNonce}">
    .auth-container { max-width: 400px; margin: 10% auto; padding: 2.5rem; background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
    .auth-container h2 { margin-bottom: 1.5rem; color: var(--text-color); }
    .form-group { margin-bottom: 1rem; text-align: left; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: var(--muted-text); }
    .form-group input { width: 100%; padding: 0.75rem; border: 1px solid var(--glass-border); border-radius: 6px; background: rgba(255,255,255,0.8); outline: none; }
    .auth-btn { width: 100%; margin-top: 1rem; }
    .error-msg { color: #ef4444; font-size: 0.9rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
<div class="auth-container">
  <h2>Create Account</h2>
  <div th:if="${error}" class="error-msg" th:text="${error}"></div>

  <form th:action="@{/signup}" method="post">
    <div class="form-group">
      <label>First Name</label>
      <input type="text" name="firstName" required minlength="1" maxlength="100" autocomplete="given-name"/>
    </div>
    <div class="form-group">
      <label>Last Name</label>
      <input type="text" name="lastName" required minlength="1" maxlength="100" autocomplete="family-name"/>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" name="email" required maxlength="254" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required minlength="12" maxlength="72" autocomplete="new-password" />
    </div>
    <button type="submit" class="btn-accent auth-btn">Create Account</button>
  </form>

  <p class="auth-switch">
    Already have an account? <a th:href="@{/login}" class="text-link">Sign in</a>
  </p>
</div>
</body>
</html>
