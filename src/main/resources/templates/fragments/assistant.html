<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- The "Ask StockWatch" assistant: a button in the corner of every signed-in page and a panel docked beside the
     page, so the page stays usable while the answer is read. assistant.js keeps the conversation per browser tab. -->
<th:block th:fragment="assistant">
  <link rel="stylesheet" th:href="@{/css/assistant.css}">
  <script th:src="@{/js/custom-alert-text.js}" defer></script>
  <script th:src="@{/js/assistant.js}" defer></script>
  <div class="sw-assistant" data-assistant th:attr="data-account=${assistantAccount}">
    <button type="button" class="sw-assistant-fab" data-assistant-toggle aria-expanded="false" aria-controls="swAssistantPanel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4h0A1.5 1.5 0 0 1 4 14.5z"/><path d="M8.5 8.5h7M8.5 11.5h4.5"/></svg>
      <span th:text="#{js.assistant.open}">Ask StockWatch</span>
    </button>
    <section id="swAssistantPanel" class="sw-assistant-panel" role="dialog" aria-modal="false" aria-labelledby="swAssistantTitle" hidden>
      <header class="sw-assistant-header">
        <h2 id="swAssistantTitle" class="sw-assistant-heading" th:text="#{js.assistant.title}">Ask StockWatch</h2>
        <button type="button" class="sw-assistant-icon" data-assistant-new th:title="#{js.assistant.newChat}" th:aria-label="#{js.assistant.newChat}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V13"/><path d="M17.5 3.5a2.1 2.1 0 0 1 3 3L13 14l-4 1 1-4z"/></svg>
        </button>
        <button type="button" class="sw-assistant-icon" data-assistant-close th:title="#{js.assistant.close}" th:aria-label="#{js.assistant.close}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="sw-assistant-notice" data-assistant-notice hidden>
        <p th:text="#{js.assistant.notice}">Messages you type here are sent to Google's Gemini service to answer them.</p>
        <button type="button" class="btn-secondary" data-assistant-notice-ok th:text="#{js.assistant.noticeOk}">Got it</button>
      </div>
      <div class="sw-assistant-log" data-assistant-log role="log" aria-live="polite" tabindex="0" th:aria-label="#{js.assistant.title}">
        <p class="sw-assistant-empty" data-assistant-empty th:text="#{js.assistant.empty}">Ask how to do something on this page.</p>
      </div>
      <div class="sw-assistant-suggestions" data-assistant-suggestions>
        <p th:text="#{js.assistant.suggestions}">Try asking</p>
        <div class="sw-assistant-chips" data-assistant-chips>
          <button type="button" class="sw-assistant-chip" th:each="question : ${assistantSuggestions}" th:text="${question}">How do I…?</button>
        </div>
      </div>
      <form class="sw-assistant-form" data-assistant-form novalidate>
        <label for="swAssistantInput" class="visually-hidden" th:text="#{js.assistant.inputLabel}">Your question</label>
        <textarea id="swAssistantInput" rows="2" maxlength="1000" data-assistant-input
                  th:placeholder="#{js.assistant.placeholder}" placeholder="Ask a question or describe an alert…"></textarea>
        <div class="sw-assistant-form-row">
          <span class="sw-assistant-counter" data-assistant-counter aria-live="polite"></span>
          <button type="submit" class="btn-accent sw-assistant-send" data-assistant-send th:text="#{js.assistant.send}">Send</button>
        </div>
      </form>
    </section>
  </div>
</th:block>
</body>
</html>
