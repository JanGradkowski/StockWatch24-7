<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="navbar">
  <nav class="navbar" aria-label="Application navigation">
    <a class="logo" th:href="@{/home}" aria-label="StockWatch 24/7 dashboard">
      <span class="logo-mark" aria-hidden="true"></span>
      <span class="logo-word">StockWatch <span>24/7</span></span>
    </a>

    <div class="search-container">
      <label for="globalTickerSearch" hidden>Search stocks or indexes</label>
      <input type="search" id="globalTickerSearch" placeholder="Search stocks or indexes — AAPL, S&amp;P 500..."
             class="global-ticker-search" autocomplete="off" aria-controls="globalSuggestionsDropdown"
             aria-autocomplete="list" aria-expanded="false">
      <div id="globalSuggestionsDropdown" class="global-suggestions" role="listbox" hidden></div>
    </div>

    <div class="nav-links">
      <span th:if="${firstName != null}" class="nav-user"><span class="nav-user-dot" aria-hidden="true"></span><span th:text="${firstName}">Trader</span></span>
      <a th:if="${firstName != null}" th:href="@{/settings}" class="nav-settings-link" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.7a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6Z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"></path></svg>
      </a>
      <a th:if="${firstName != null}" href="/home" class="btn-primary">Dashboard</a>
      <form th:if="${firstName != null}" th:action="@{/logout}" method="post" class="logout-form">
        <button type="submit" class="logout-btn">Sign out</button>
      </form>

      <a th:if="${firstName == null}" href="/login" class="btn-primary">Sign In</a>
      <a th:if="${firstName == null}" href="/signup" class="btn-accent">Get started</a>
    </div>
    <span th:if="${firstName != null}" id="accountThemeSync" hidden
          th:attr="data-theme-endpoint=@{/api/settings/theme},data-csrf-token=${_csrf.token}"></span>
  </nav>

  <script th:attr="nonce=${cspNonce}">
    document.addEventListener("DOMContentLoaded", function() {
      const searchInput = document.getElementById('globalTickerSearch');
      const dropdown = document.getElementById('globalSuggestionsDropdown');
      let searchTimer = null;
      let localSearchController = null;
      let providerSearchController = null;
      let searchSequence = 0;

      if (searchInput && dropdown) {
        searchInput.addEventListener('input', (e) => {
          const query = e.target.value.trim();
          clearTimeout(searchTimer);
          localSearchController?.abort();
          providerSearchController?.abort();
          if (query.length < 2) {
            dropdown.hidden = true;
            searchInput.setAttribute('aria-expanded', 'false');
            return;
          }

          searchTimer = setTimeout(() => runTickerSearch(query), 225);
        });

        async function runTickerSearch(query) {
          const sequence = ++searchSequence;
          localSearchController?.abort();
          providerSearchController?.abort();
          localSearchController = new AbortController();
          try {
            const response = await fetch(`/api/stocks/search/local?q=${encodeURIComponent(query)}`, {
              signal: localSearchController.signal
            });
            if (!response.ok) {
              dropdown.hidden = true;
              searchInput.setAttribute('aria-expanded', 'false');
              return;
            }
            const suggestions = await response.json();
            if (sequence !== searchSequence || searchInput.value.trim() !== query) return;
            renderSuggestions(suggestions);

            if (suggestions.length < 8) {
              providerSearchController = new AbortController();
              const providerResponse = await fetch(`/api/stocks/search?q=${encodeURIComponent(query)}`, {
                signal: providerSearchController.signal
              });
              if (!providerResponse.ok) return;
              const enrichedSuggestions = await providerResponse.json();
              if (sequence !== searchSequence || searchInput.value.trim() !== query) return;
              renderSuggestions(enrichedSuggestions);
            }
          } catch (err) {
            if (err.name !== 'AbortError') {
              console.error("Autocomplete failed", err);
              searchInput.setAttribute('aria-expanded', 'false');
            }
          }
        }

        function renderSuggestions(suggestions) {
            if (suggestions.length === 0) {
              dropdown.hidden = true;
              searchInput.setAttribute('aria-expanded', 'false');
              return;
            }

            dropdown.replaceChildren();
            suggestions.forEach(item => {
              const symbol = String(item.symbol || '');
              const micCode = String(item.micCode || '');
              const region = String(item.region || '');
              const currency = String(item.currency || '');
              const instrumentType = String(item.instrumentType || 'EQUITY').toUpperCase();
              const row = document.createElement('button');
              row.type = 'button';
              row.className = 'suggestion-row';
              row.setAttribute('role', 'option');
              row.addEventListener('click', () => {
                const listingQuery = micCode ? `?mic=${encodeURIComponent(micCode)}` : '';
                const destination = `/stock/${encodeURIComponent(symbol)}${listingQuery}`;
                if (typeof window.requestStockWatchNavigation === 'function') {
                  window.requestStockWatchNavigation(destination);
                } else {
                  window.location.assign(destination);
                }
              });

              const content = document.createElement('span');
              content.className = 'suggestion-content';
              const initials = document.createElement('span');
              initials.className = 'suggestion-initials';
              initials.classList.toggle('index', instrumentType === 'INDEX');
              initials.textContent = String(item.initials || symbol.slice(0, 2));

              const labels = document.createElement('span');
              const symbolRow = document.createElement('span');
              symbolRow.className = 'suggestion-symbol-row';
              const symbolLabel = document.createElement('strong');
              symbolLabel.className = 'suggestion-symbol';
              symbolLabel.textContent = symbol;
              const typeLabel = document.createElement('span');
              typeLabel.className = 'suggestion-type';
              typeLabel.textContent = instrumentType === 'INDEX' ? 'INDEX' : instrumentType;
              typeLabel.hidden = instrumentType === 'EQUITY';
              const nameLabel = document.createElement('span');
              nameLabel.className = 'suggestion-name';
              nameLabel.textContent = String(item.name || symbol);
              const listingLabel = document.createElement('span');
              listingLabel.className = 'suggestion-listing';
              listingLabel.textContent = [region, currency].filter(Boolean).join(' / ');

              symbolRow.append(symbolLabel, typeLabel);
              labels.append(symbolRow, nameLabel, listingLabel);
              content.append(initials, labels);
              row.append(content);
              dropdown.append(row);
            });

            dropdown.hidden = false;
            searchInput.setAttribute('aria-expanded', 'true');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
          if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.hidden = true;
            searchInput.setAttribute('aria-expanded', 'false');
          }
        });
      }
    });
  </script>
</div>
</body>
</html>
