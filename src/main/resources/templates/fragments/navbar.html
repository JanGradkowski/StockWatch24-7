<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="navbar">
  <nav class="navbar" aria-label="Application navigation">
    <a class="logo" th:href="@{/home}" aria-label="StockWatch 24/7 dashboard">
      <span class="logo-mark" aria-hidden="true"></span>
      <span class="logo-word">StockWatch <span>24/7</span></span>
    </a>

    <div class="search-container">
      <label for="globalTickerSearch" hidden>Search stocks or indexes</label>
      <input type="search" id="globalTickerSearch" placeholder="Search stocks or indexes — AAPL, S&amp;P 500..."
             class="global-ticker-search" autocomplete="off" aria-controls="globalSuggestionsDropdown"
             aria-autocomplete="list" aria-expanded="false">
      <div id="globalSuggestionsDropdown" class="global-suggestions" role="listbox" hidden></div>
    </div>

    <div class="nav-links">
      <span th:if="${firstName != null}" class="nav-user"><span class="nav-user-dot" aria-hidden="true"></span><span th:text="${firstName}">Trader</span></span>
      <a th:if="${firstName != null}" href="/home" class="btn-primary">Dashboard</a>
      <form th:if="${firstName != null}" th:action="@{/logout}" method="post" class="logout-form">
        <button type="submit" class="logout-btn">Sign out</button>
      </form>

      <a th:if="${firstName == null}" href="/login" class="btn-primary">Sign In</a>
      <a th:if="${firstName == null}" href="/signup" class="btn-accent">Get started</a>
    </div>
  </nav>

  <script th:attr="nonce=${cspNonce}">
    document.addEventListener("DOMContentLoaded", function() {
      const searchInput = document.getElementById('globalTickerSearch');
      const dropdown = document.getElementById('globalSuggestionsDropdown');
      let searchTimer = null;

      if (searchInput && dropdown) {
        searchInput.addEventListener('input', (e) => {
          const query = e.target.value.trim();
          if (query.length < 2) {
            dropdown.hidden = true;
            searchInput.setAttribute('aria-expanded', 'false');
            return;
          }

          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => runTickerSearch(query), 700);
        });

        async function runTickerSearch(query) {

          try {
            const response = await fetch(`/api/stocks/search?q=${encodeURIComponent(query)}`);
            if (!response.ok) {
              dropdown.hidden = true;
              searchInput.setAttribute('aria-expanded', 'false');
              return;
            }
            const suggestions = await response.json();

            if (suggestions.length === 0) {
              dropdown.hidden = true;
              searchInput.setAttribute('aria-expanded', 'false');
              return;
            }

            dropdown.replaceChildren();
            suggestions.forEach(item => {
              const symbol = String(item.symbol || '');
              const instrumentType = String(item.instrumentType || 'EQUITY').toUpperCase();
              const row = document.createElement('button');
              row.type = 'button';
              row.className = 'suggestion-row';
              row.setAttribute('role', 'option');
              row.addEventListener('click', () => {
                window.location.assign(`/stock/${encodeURIComponent(symbol)}`);
              });

              const content = document.createElement('span');
              content.className = 'suggestion-content';
              const initials = document.createElement('span');
              initials.className = 'suggestion-initials';
              initials.classList.toggle('index', instrumentType === 'INDEX');
              initials.textContent = String(item.initials || symbol.slice(0, 2));

              const labels = document.createElement('span');
              const symbolRow = document.createElement('span');
              symbolRow.className = 'suggestion-symbol-row';
              const symbolLabel = document.createElement('strong');
              symbolLabel.className = 'suggestion-symbol';
              symbolLabel.textContent = symbol;
              const typeLabel = document.createElement('span');
              typeLabel.className = 'suggestion-type';
              typeLabel.textContent = instrumentType === 'INDEX' ? 'INDEX' : instrumentType;
              typeLabel.hidden = instrumentType === 'EQUITY';
              const nameLabel = document.createElement('span');
              nameLabel.className = 'suggestion-name';
              nameLabel.textContent = String(item.name || symbol);

              symbolRow.append(symbolLabel, typeLabel);
              labels.append(symbolRow, nameLabel);
              content.append(initials, labels);
              row.append(content);
              dropdown.append(row);
            });

            dropdown.hidden = false;
            searchInput.setAttribute('aria-expanded', 'true');
          } catch (err) {
            console.error("Autocomplete failed", err);
            searchInput.setAttribute('aria-expanded', 'false');
          }
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
          if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.hidden = true;
            searchInput.setAttribute('aria-expanded', 'false');
          }
        });
      }
    });
  </script>
</div>
</body>
</html>
