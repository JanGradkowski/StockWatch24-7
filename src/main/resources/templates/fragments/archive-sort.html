<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<a th:fragment="column(path, archive, key, label, initialDirection, filter)"
   th:with="active=${archive.sort() == key},next=${active ? (archive.direction() == 'asc' ? 'desc' : 'asc') : initialDirection},currentWord=${archive.direction() == 'asc' ? #messages.msg('archive.sort.ascending') : #messages.msg('archive.sort.descending')},nextWord=${next == 'asc' ? #messages.msg('archive.sort.ascending') : #messages.msg('archive.sort.descending')}"
   class="archive-column-sort"
   th:classappend="${active ? 'is-' + archive.direction() : ''}"
   th:href="${filter != null} ? @{${path}(sort=${key},direction=${next},page=0,state=${filter.state()},ticker=${filter.ticker()},type=${filter.typeParameter()})} : @{${path}(sort=${key},direction=${next},page=0)}"
   th:attr="data-sort-key=${key},data-sort-direction=${active ? archive.direction() : 'none'},aria-label=${active ? #messages.msg('archive.sort.ariaActive', label, currentWord, nextWord) : #messages.msg('archive.sort.aria', label, nextWord)},title=${#messages.msg('archive.sort.title', label, nextWord)}">
  <span th:text="${label}">Ticker</span>
  <svg viewBox="0 0 12 16" aria-hidden="true" focusable="false">
    <path class="sort-arrow-up" d="m3 6 3-3 3 3"/>
    <path class="sort-arrow-down" d="m3 10 3 3 3-3"/>
  </svg>
</a>
<!--/* A sortable column title for the list tables: the arrow shows on the sorted column, and aria-sort says which. */-->
<th th:fragment="header(links, archive, key, label, initialDirection, className)" scope="col" th:class="${className}"
    th:with="active=${archive.sort() == key},next=${active ? (archive.direction() == 'asc' ? 'desc' : 'asc') : initialDirection},currentWord=${archive.direction() == 'asc' ? #messages.msg('archive.sort.ascending') : #messages.msg('archive.sort.descending')},nextWord=${next == 'asc' ? #messages.msg('archive.sort.ascending') : #messages.msg('archive.sort.descending')}"
    th:attr="aria-sort=${active ? (archive.direction() == 'asc' ? 'ascending' : 'descending') : 'none'}">
  <a class="ca-sort" th:href="${links.get(key)}"
     th:attr="aria-label=${active ? #messages.msg('archive.sort.ariaActive', label, currentWord, nextWord) : #messages.msg('archive.sort.aria', label, nextWord)},title=${#messages.msg('archive.sort.title', label, nextWord)}"><span th:text="${label}">Ticker</span><svg viewBox="0 0 24 24" class="ca-icon" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></a>
</th>
</body>
</html>
