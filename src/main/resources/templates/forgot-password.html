<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:attr="data-account-theme=${accountTheme}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Forgot password — StockWatch 24/7</title><script th:src="@{/js/theme.js}"></script><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="auth-page"><div class="bg-animation" aria-hidden="true"><div class="glow-orb orb-1"></div><div class="glow-orb orb-2"></div></div>
<main class="auth-shell auth-shell-compact"><section class="auth-showcase"><a class="logo" th:href="@{/}" aria-label="Back to StockWatch 24/7"><span class="logo-mark" aria-hidden="true"></span><span class="logo-word">StockWatch <span>24/7</span></span></a><div class="auth-pitch"><div class="eyebrow">Account recovery</div><h1>Recover access<br><span class="text-gradient">securely.</span></h1><p>We send a short-lived, single-use code to the verified email on the account.</p></div></section>
<section class="auth-card"><div class="auth-kicker">Password recovery</div><h2>Request a reset code</h2><p class="auth-description">For privacy, the response is the same whether or not an eligible account exists.</p>
<form th:action="@{/forgot-password}" method="post"><div class="form-group"><label for="forgotEmail">Email address</label><input id="forgotEmail" type="email" name="email" required maxlength="254" autocomplete="username"></div><button type="submit" class="btn-accent auth-btn">Send reset code</button></form>
<p class="auth-switch"><a th:href="@{/login}" class="text-link">Back to sign in</a></p></section></main></body></html>
