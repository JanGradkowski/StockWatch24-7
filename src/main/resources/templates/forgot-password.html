<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" th:attr="data-account-theme=${accountTheme},data-learning-mode=${learningMode == true ? 'on' : null}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="|#{auth.forgot.title} — StockWatch 24/7|">Forgot password — StockWatch 24/7</title><script th:src="@{/i18n/messages.js(lang=${#locale.language},v=${T(org.example.stockwatch247.i18n.I18nScriptController).VERSION})}"></script><script th:src="@{/js/theme.js}"></script><link rel="stylesheet" th:href="@{/css/tokens.css}"><link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/design.css}">
  <link rel="stylesheet" th:href="@{/css/refresh.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script th:src="@{/js/design-ui.js}" defer></script>
</head>
<body class="auth-page ui-refresh"><main class="auth-shell auth-shell-compact"><section class="auth-showcase"><a class="logo" th:href="@{/}" aria-label="Back to StockWatch 24/7" th:aria-label="#{auth.backHome}"><span class="logo-mark" aria-hidden="true"></span><span class="logo-word">StockWatch <span>24/7</span></span></a><div class="auth-pitch"><div class="eyebrow" th:text="#{auth.forgot.eyebrow}">Account recovery</div><h1><span th:text="#{auth.forgot.headline1}">Recover access</span><br><span class="text-gradient" th:text="#{auth.forgot.headline2}">securely.</span></h1><p th:text="#{auth.forgot.pitch}">Use an email code to reset your password.</p></div></section>
<section class="auth-card"><h2 th:text="#{auth.forgot.heading}">Request a reset code</h2><p class="auth-description" th:text="#{auth.forgot.description}">Enter your account email. If it can receive a reset code, we will send one.</p>
<form th:action="@{/forgot-password}" method="post"><div class="form-group"><label for="forgotEmail" th:text="#{auth.email}">Email address</label><input id="forgotEmail" type="email" name="email" required maxlength="254" autocomplete="username"></div><button type="submit" class="btn-accent auth-btn" th:text="#{auth.forgot.submit}">Send reset code</button></form>
<p class="auth-switch"><a th:href="@{/login}" class="text-link" th:text="#{auth.backToSignIn}">Back to sign in</a></p></section></main></body></html>
