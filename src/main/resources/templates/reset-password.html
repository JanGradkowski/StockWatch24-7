<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:attr="data-account-theme=${accountTheme}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset password — StockWatch 24/7</title><script th:src="@{/js/theme.js}"></script><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="auth-page"><div class="bg-animation" aria-hidden="true"><div class="glow-orb orb-1"></div><div class="glow-orb orb-2"></div></div>
<main class="auth-shell auth-shell-compact"><section class="auth-showcase"><a class="logo" th:href="@{/}" aria-label="Back to StockWatch 24/7"><span class="logo-mark" aria-hidden="true"></span><span class="logo-word">StockWatch <span>24/7</span></span></a><div class="auth-pitch"><div class="eyebrow">Five-minute code</div><h1>Choose a new<br><span class="text-gradient">unique password.</span></h1><p>The code can be used once. Completing this reset signs out every existing session.</p></div></section>
<section class="auth-card"><div class="auth-kicker">Password recovery</div><h2>Reset your password</h2>
<div th:if="${param.requested}" class="auth-message success-msg">If the account is eligible, a reset code has been sent.</div><div th:if="${error}" class="auth-message error-msg" th:text="${error}"></div>
<form th:action="@{/reset-password}" method="post"><div class="form-group"><label for="resetEmail">Email address</label><input id="resetEmail" type="email" name="email" required maxlength="254" autocomplete="username"></div><div class="form-group"><label for="resetCode">Eight-digit email code</label><input id="resetCode" name="code" required minlength="8" maxlength="8" inputmode="numeric" autocomplete="one-time-code"></div><div class="form-group"><label for="resetNewPassword">New password</label><input id="resetNewPassword" type="password" name="newPassword" required minlength="15" maxlength="72" autocomplete="new-password"></div><div class="form-group"><label for="resetConfirmPassword">Confirm new password</label><input id="resetConfirmPassword" type="password" name="confirmPassword" required minlength="15" maxlength="72" autocomplete="new-password"></div><button type="submit" class="btn-accent auth-btn">Reset password</button></form>
<p class="auth-switch"><a th:href="@{/forgot-password}" class="text-link">Request another code</a></p></section></main></body></html>
