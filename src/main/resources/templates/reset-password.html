<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" th:attr="data-account-theme=${accountTheme}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="|#{auth.reset.title} — StockWatch 24/7|">Reset password — StockWatch 24/7</title><script th:src="@{/i18n/messages.js(lang=${#locale.language},v=${T(org.example.stockwatch247.i18n.I18nScriptController).VERSION})}"></script><script th:src="@{/js/theme.js}"></script><link rel="stylesheet" th:href="@{/css/tokens.css}"><link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/design.css}">
  <script th:src="@{/js/design-ui.js}" defer></script>
</head>
<body class="auth-page"><div class="bg-animation" aria-hidden="true"><div class="glow-orb orb-1"></div><div class="glow-orb orb-2"></div></div>
<main class="auth-shell auth-shell-compact"><section class="auth-showcase"><a class="logo" th:href="@{/}" aria-label="Back to StockWatch 24/7" th:aria-label="#{auth.backHome}"><span class="logo-mark" aria-hidden="true"></span><span class="logo-word">StockWatch <span>24/7</span></span></a><div class="auth-pitch"><div class="eyebrow" th:text="#{auth.reset.eyebrow}">Five-minute code</div><h1><span th:text="#{auth.reset.headline1}">Choose a new</span><br><span class="text-gradient" th:text="#{auth.reset.headline2}">unique password.</span></h1><p th:text="#{auth.reset.pitch}">The code can be used once. Completing this reset signs out every existing session.</p></div></section>
<section class="auth-card"><h2 th:text="#{auth.reset.heading}">Reset your password</h2>
<div th:if="${param.requested}" class="auth-message success-msg" th:text="#{auth.reset.requested}">If the account is eligible, a reset code has been sent.</div><div th:if="${error}" class="auth-message error-msg" th:text="${T(org.example.stockwatch247.i18n.ServerMessages).translate(error)}"></div>
<form th:action="@{/reset-password}" method="post" data-history-ignore><div class="form-group"><label for="resetEmail" th:text="#{auth.email}">Email address</label><input id="resetEmail" type="email" name="email" required maxlength="254" autocomplete="username"></div><div class="form-group"><label for="resetCode" th:text="#{auth.reset.code}">Eight-digit email code</label><input id="resetCode" name="code" required minlength="8" maxlength="8" inputmode="numeric" autocomplete="one-time-code"></div><div class="form-group"><label for="resetNewPassword" th:text="#{auth.reset.newPassword}">New password</label><input id="resetNewPassword" type="password" name="newPassword" required minlength="15" maxlength="72" autocomplete="new-password"></div><div class="form-group"><label for="resetConfirmPassword" th:text="#{auth.reset.confirmPassword}">Confirm new password</label><input id="resetConfirmPassword" type="password" name="confirmPassword" required minlength="15" maxlength="72" autocomplete="new-password"></div><button type="submit" class="btn-accent auth-btn" th:text="#{auth.reset.submit}">Reset password</button></form>
<p class="auth-switch"><a th:href="@{/forgot-password}" class="text-link" th:text="#{auth.reset.another}">Request another code</a></p></section></main></body></html>
