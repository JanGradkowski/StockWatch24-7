<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:attr="data-account-theme=${accountTheme}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cancel account deletion — StockWatch 24/7</title><script th:src="@{/js/theme.js}"></script><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="auth-page"><div class="bg-animation" aria-hidden="true"><div class="glow-orb orb-1"></div><div class="glow-orb orb-2"></div></div>
<main class="auth-shell auth-shell-compact"><section class="auth-showcase"><a class="logo" th:href="@{/}" aria-label="Back to StockWatch 24/7"><span class="logo-mark" aria-hidden="true"></span><span class="logo-word">StockWatch <span>24/7</span></span></a><div class="auth-pitch"><div class="eyebrow">Deletion safeguard</div><h1>Keep your<br><span class="text-gradient">account and alerts.</span></h1><p>The email link brought you here, but no account state changes until you confirm below.</p></div></section>
<section class="auth-card"><div class="auth-kicker">Account deletion</div><h2>Cancel scheduled deletion?</h2><p class="auth-description">Confirming reactivates the account. You can then sign in normally.</p><form th:action="@{/cancel-account-deletion}" method="post"><input type="hidden" name="token" th:value="${token}"><button class="btn-accent auth-btn" type="submit">Keep my account</button></form><p class="auth-switch"><a th:href="@{/}" class="text-link">Leave deletion scheduled</a></p></section></main></body></html>
