<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" th:attr="data-account-theme=${accountTheme}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="|#{auth.cancelDeletion.title} — StockWatch 24/7|">Cancel account deletion — StockWatch 24/7</title><script th:src="@{/i18n/messages.js(lang=${#locale.language},v=${T(org.example.stockwatch247.i18n.I18nScriptController).VERSION})}"></script><script th:src="@{/js/theme.js}"></script><link rel="stylesheet" th:href="@{/css/tokens.css}"><link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/design.css}">
  <script th:src="@{/js/design-ui.js}" defer></script>
</head>
<body class="auth-page"><div class="bg-animation" aria-hidden="true"><div class="glow-orb orb-1"></div><div class="glow-orb orb-2"></div></div>
<main class="auth-shell auth-shell-compact"><section class="auth-showcase"><a class="logo" th:href="@{/}" aria-label="Back to StockWatch 24/7" th:aria-label="#{auth.backHome}"><span class="logo-mark" aria-hidden="true"></span><span class="logo-word">StockWatch <span>24/7</span></span></a><div class="auth-pitch"><div class="eyebrow" th:text="#{auth.cancelDeletion.eyebrow}">Keep your account</div><h1><span th:text="#{auth.cancelDeletion.headline1}">Keep your</span><br><span class="text-gradient" th:text="#{auth.cancelDeletion.headline2}">account and alerts.</span></h1><p th:text="#{auth.cancelDeletion.pitch}">Your account will remain scheduled for deletion unless you confirm below.</p></div></section>
<section class="auth-card"><div class="auth-kicker" th:text="#{auth.cancelDeletion.kicker}">Account deletion</div><h2 th:text="#{auth.cancelDeletion.heading}">Cancel scheduled deletion?</h2><p class="auth-description" th:text="#{auth.cancelDeletion.description}">Confirming reactivates the account. You can then sign in normally.</p><form th:action="@{/cancel-account-deletion}" method="post"><button class="btn-accent auth-btn" type="submit" th:text="#{auth.cancelDeletion.keep}">Keep my account</button></form><p class="auth-switch"><a th:href="@{/}" class="text-link" th:text="#{auth.cancelDeletion.leave}">Leave deletion scheduled</a></p></section></main></body></html>
